name: Bug report
description: Report a reproducible problem.
title: "[Bug] "
labels: [bug, triage]
body:
  - type: input
    id: requirement
    attributes:
      label: Requirement or feature
      description: Include the REQ, SEC, A11Y, DOC, or feature dictionary ID.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
