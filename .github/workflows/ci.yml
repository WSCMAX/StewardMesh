# Requirements: REQ-DIRECTORY-EXPANSION-007, REQ-DIRECTORY-EXPANSION-009.
# Features: platform.foundation, experience.help.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: stewardmesh
          POSTGRES_PASSWORD: stewardmesh
          POSTGRES_DB: stewardmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stewardmesh -d stewardmesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STEWARDMESH_TEST_DATABASE_URL: postgres://stewardmesh:stewardmesh@localhost:5432/stewardmesh?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go tool govulncheck ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run openapi:lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Verify core documentation
        run: test -f README.md && test -f docs/features/dictionary.md && test -f docs/requirements/initial.md
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
      - name: Validate protobuf contract
        run: protoc --proto_path=api/proto --descriptor_set_out=/tmp/stewardmesh.pb api/proto/stewardmesh.proto
      - name: Verify requirement traceability
        run: go run ./cmd/tracecheck

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate default Compose configuration
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: Validate cache Compose profile
        run: docker compose -f deploy/docker-compose.yml --profile cache config --quiet
      - name: Validate synthetic demo Compose profile
        run: docker compose -f deploy/docker-compose.yml --profile demo config --quiet
      - name: Validate integrations Compose profile
        run: docker compose -f deploy/docker-compose.yml --profile integrations config --quiet
      - name: Build application container
        run: docker build --file deploy/Dockerfile --target stewardmesh --tag stewardmesh:ci .
      - name: Build Grouper fixture container
        run: docker build --file deploy/Dockerfile --target grouper-fixture --tag stewardmesh-grouper-fixture:ci .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
