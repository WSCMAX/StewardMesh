components:
  securitySchemes:
    localCookieAuth:
      type: apiKey
      in: cookie
      name: stewardmesh_session
      description: Opaque server-side session identifier used only by loopback HTTP development.
    secureCookieAuth:
      type: apiKey
      in: cookie
      name: __Host-stewardmesh_session
      description: Opaque, Secure, host-only server-side session identifier used by HTTPS deployments.
  headers:
    NoStore:
      description: Protected feature, planning, and integration data is never stored by shared or browser caches.
      schema: {type: string, const: no-store}
  parameters:
    PatternsTemplateID:
      in: path
      name: templateId
      required: true
      description: Stable built-in or organization-owned template identity.
      schema: {$ref: '#/components/schemas/PatternsTemplateID'}
    PatternsVersion:
      in: query
      name: version
      required: false
      description: Exact immutable version. When omitted, the latest version is resolved.
      schema: {type: integer, format: int64, minimum: 1}
    AssetID:
      in: path
      name: assetId
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
    AssetModelID:
      in: path
      name: modelId
      required: true
      schema: {$ref: '#/components/schemas/AssetModelID'}
    AssetIdentifierID:
      in: path
      name: identifierId
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
    TagID:
      in: path
      name: tagId
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
    GoalID:
      in: path
      name: goalId
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
    BlobID:
      in: path
      name: blobId
      required: true
      schema: {type: string, pattern: '^[a-f0-9]{32}$'}
    VaultDownloadToken:
      in: query
      name: token
      required: true
      description: Short-lived HMAC grant returned for local Vault content. S3-compatible authorizations use their provider URL instead.
      schema: {type: string, minLength: 40, maxLength: 160}
    HorizonPlanID:
      in: path
      name: planId
      required: true
      schema: {$ref: '#/components/schemas/HorizonID'}
    HorizonAssetID:
      in: query
      name: assetId
      required: false
      schema: {$ref: '#/components/schemas/HorizonID'}
    HorizonScenario:
      in: query
      name: scenario
      required: false
      schema: {$ref: '#/components/schemas/HorizonScenario'}
    HorizonScenarios:
      in: query
      name: scenarios
      required: false
      description: Comma-separated scenario identifiers. Values are trimmed, normalized to lowercase, deduplicated, and limited to five. Defaults to baseline.
      schema: {type: string, minLength: 1, maxLength: 324, default: baseline}
    HorizonAsOf:
      in: query
      name: asOf
      required: false
      description: Forecast cutoff. Defaults to the current time.
      schema: {type: string, format: date-time}
    HorizonFromYear:
      in: query
      name: fromYear
      required: false
      description: First forecast year. Defaults to the as-of year.
      schema: {type: integer, minimum: 1970, maximum: 9999}
    HorizonToYear:
      in: query
      name: toYear
      required: false
      description: Last forecast year, inclusive. Defaults to ten years after fromYear and may span at most 50 years.
      schema: {type: integer, minimum: 1970, maximum: 9999}
    HorizonFiscalYearStartMonth:
      in: query
      name: fiscalYearStartMonth
      required: false
      schema: {type: integer, minimum: 1, maximum: 12, default: 1}
    HorizonGroupBy:
      in: query
      name: groupBy
      required: false
      schema:
        type: string
        enum: [fiscal_year, department, site, tag, goal, asset_class]
        default: fiscal_year
    ThreadTargetType:
      in: path
      name: targetType
      required: true
      schema: {$ref: '#/components/schemas/ThreadTargetType'}
    GoalTargetType:
      in: path
      name: targetType
      required: true
      schema: {type: string, enum: [asset, purchase]}
    ThreadTargetID:
      in: path
      name: targetId
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
    LedgerFiscalPeriod:
      in: query
      name: fiscalPeriod
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,31}$'}
    LedgerScenario:
      in: query
      name: scenario
      required: true
      schema: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'}
    CSRFToken:
      in: header
      name: X-CSRF-Token
      required: true
      description: Unpredictable synchronized token returned with the current session and kept only in application memory.
      schema:
        type: string
        minLength: 32
        maxLength: 128
    DirectoryImportBatchID:
      in: path
      name: batchID
      required: true
      description: Stable organization-owned directory import batch identity.
      schema: {$ref: '#/components/schemas/DirectoryImportBatchID'}
    DirectoryImportIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Caller-generated key scoped to the organization and exact preview, apply, or retry operation. Only its SHA-256 digest is retained; neither the raw key nor its digest is returned.
      schema:
        type: string
        minLength: 8
        maxLength: 200
  responses:
    InvalidRequest:
      description: Invalid or malformed request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Authentication is required or the session is invalid
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: CSRF, origin, bootstrap-token, or permission validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: The requested record or referenced record was not found in the organization
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: The requested change conflicts with existing or effective-dated data
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnprocessableEntity:
      description: A referenced organization resource does not exist or cannot be used for this request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Locked:
      description: The imported resource is write-locked until local ownership is explicitly claimed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: The uploaded file exceeds the configured Vault size limit
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: Internal service error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ServiceUnavailable:
      description: The requested subsystem is not configured or is temporarily unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    BootstrapStatus:
      type: object
      required: [required, tokenRequired, minimumPasswordCharacters, oidcEnabled, samlEnabled]
      properties:
        required: {type: boolean}
        tokenRequired: {type: boolean}
        minimumPasswordCharacters: {type: integer, minimum: 15}
        oidcEnabled: {type: boolean}
        samlEnabled: {type: boolean}
    BootstrapAdministratorRequest:
      type: object
      additionalProperties: false
      required: [username, email, displayName, password]
      properties:
        username: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$'}
        email: {type: string, format: email, maxLength: 320}
        displayName: {type: string, minLength: 1, maxLength: 200}
        password: {type: string, format: password, writeOnly: true, minLength: 15, maxLength: 1024}
        bootstrapToken: {type: string, format: password, writeOnly: true, minLength: 32, maxLength: 1024}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 64}
        password: {type: string, format: password, writeOnly: true, maxLength: 1024}
    SessionResponse:
      type: object
      required: [principal, permissions, grants, csrfToken, expiresAt]
      properties:
        principal: {$ref: '#/components/schemas/Principal'}
        permissions:
          type: array
          description: Organization-scoped permission hints for interface rendering; server authorization remains authoritative.
          items: {type: string, pattern: '^[a-z][a-z0-9._-]{2,127}$'}
          uniqueItems: true
        grants:
          type: array
          description: REQ-WORKSPACE-001 experience.workspace organization, site, department, or resource-scoped interface hints. These hints never replace server authorization.
          items: {$ref: '#/components/schemas/SessionGrant'}
        csrfToken: {type: string, minLength: 32, maxLength: 128}
        expiresAt: {type: string, format: date-time}
    SessionGrant:
      type: object
      required: [permission, scope]
      properties:
        permission: {type: string, pattern: '^[a-z][a-z0-9._-]{2,127}$'}
        scope:
          type: object
          required: [kind, resourceId]
          properties:
            kind: {type: string, enum: [organization, site, department, resource]}
            resourceId: {type: string, minLength: 1, maxLength: 200}
    Principal:
      type: object
      required: [subject, organizationId, username, email, displayName, roles]
      properties:
        subject: {type: string, minLength: 1}
        organizationId: {type: string, minLength: 1}
        username: {type: string, minLength: 1}
        email: {type: string, format: email}
        displayName: {type: string, minLength: 1}
        roles:
          type: array
          items: {type: string}
    GuardAccount:
      type: object
      required: [id, username, email, displayName, status]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{32}$'}
        username: {type: string, minLength: 1, maxLength: 64}
        email: {type: string, format: email, maxLength: 320}
        displayName: {type: string, minLength: 1, maxLength: 200}
        status: {type: string, enum: [active, disabled]}
    GuardRole:
      type: object
      required: [id, name, description, permissions, policyBundleIds, source, managed]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{32}$'}
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 1000}
        permissions:
          type: array
          items: {type: string, pattern: '^[a-z][a-z0-9._-]{2,127}$'}
          uniqueItems: true
        policyBundleIds:
          type: array
          items: {type: string, pattern: '^[a-f0-9]{32}$'}
          uniqueItems: true
        source: {type: string, enum: [builtin, local]}
        managed:
          type: boolean
          description: Built-in roles are managed by StewardMesh and cannot be changed.
    GuardPolicyBundle:
      type: object
      required: [id, name, description, permissions]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{32}$'}
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 1000}
        permissions:
          type: array
          items: {type: string, pattern: '^[a-z][a-z0-9._-]{2,127}$'}
          uniqueItems: true
    GuardAssignmentScope:
      type: object
      additionalProperties: false
      required: [kind, resourceId]
      properties:
        kind: {type: string, enum: [organization, site, department, resource]}
        resourceId: {type: string, minLength: 1, maxLength: 128}
    GuardAssignmentRequestScope:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, enum: [organization, site, department, resource]}
        resourceId:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          maxLength: 128
          description: Required for site, department, and resource scopes; ignored for organization scope.
    GuardRoleAssignment:
      type: object
      required: [id, accountId, roleId, scope, source, managed, createdAt]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{32}$'}
        accountId: {type: string, pattern: '^[a-f0-9]{32}$'}
        roleId: {type: string, pattern: '^[a-f0-9]{32}$'}
        scope: {$ref: '#/components/schemas/GuardAssignmentScope'}
        source:
          type: string
          pattern: '^(local|oidc:[a-f0-9]{32})$'
          description: Local assignments are editable; OIDC assignments are synchronized from the identity provider.
        managed: {type: boolean}
        createdAt: {type: string, format: date-time}
    GuardAccessDirectory:
      type: object
      required: [accounts, roles, policyBundles, availablePermissions, assignments]
      properties:
        accounts:
          type: array
          items: {$ref: '#/components/schemas/GuardAccount'}
        roles:
          type: array
          items: {$ref: '#/components/schemas/GuardRole'}
        policyBundles:
          type: array
          items: {$ref: '#/components/schemas/GuardPolicyBundle'}
        availablePermissions:
          type: array
          items: {type: string, pattern: '^[a-z][a-z0-9._-]{2,127}$'}
          uniqueItems: true
        assignments:
          type: array
          items: {$ref: '#/components/schemas/GuardRoleAssignment'}
    CreateGuardRoleRequest:
      type: object
      additionalProperties: false
      required: [name, permissions, policyBundleIds]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 1000}
        permissions:
          type: array
          items: {type: string, pattern: '^[a-z][a-z0-9._-]{2,127}$'}
          uniqueItems: true
        policyBundleIds:
          type: array
          items: {type: string, pattern: '^[a-f0-9]{32}$'}
          uniqueItems: true
      anyOf:
        - properties:
            permissions: {minItems: 1}
        - properties:
            policyBundleIds: {minItems: 1}
    CreateGuardRoleAssignmentRequest:
      type: object
      additionalProperties: false
      required: [accountId, roleId, scope]
      properties:
        accountId: {type: string, pattern: '^[a-f0-9]{32}$'}
        roleId: {type: string, pattern: '^[a-f0-9]{32}$'}
        scope: {$ref: '#/components/schemas/GuardAssignmentRequestScope'}
    GuardResourceOwnership:
      type: object
      required: [resourceType, resourceId, sourceSystemId, sourceRecordId, writeLocked, registeredAt]
      properties:
        resourceType: {type: string, pattern: '^[a-z][a-z0-9_.-]{0,63}$'}
        resourceId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        sourceSystemId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        sourceRecordId: {type: string, minLength: 1, maxLength: 256}
        writeLocked: {type: boolean}
        registeredAt: {type: string, format: date-time}
        claimedBy: {type: string, pattern: '^[a-f0-9]{32}$'}
        claimedAt: {type: string, format: date-time}
    GuardResourceOwnershipCollection:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/GuardResourceOwnership'}
    RegisterGuardResourceOwnershipRequest:
      type: object
      additionalProperties: false
      required: [resourceType, resourceId, sourceSystemId, sourceRecordId]
      properties:
        resourceType: {type: string, pattern: '^[a-z][a-z0-9_.-]{0,63}$'}
        resourceId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        sourceSystemId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        sourceRecordId: {type: string, minLength: 1, maxLength: 256}
    Organization:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        name: {type: string, minLength: 1, maxLength: 200}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    PatternsTemplateID:
      type: string
      description: Stable identity shared by schema discovery, validation, CSV tooling, and Exchange.
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    PatternsRecordType:
      type: string
      description: Provider-neutral record family addressed by a template.
      pattern: '^[a-z][a-z0-9.-]{1,79}$'
    PatternsFieldType:
      type: string
      description: Seven portable field types supported by form, CSV, and Exchange validation clients.
      enum: [text, number, date, money, enum, attachment, reference]
    PatternsTemplateStatus:
      type: string
      enum: [active, retired]
    PatternsValidationStatus:
      type: string
      enum: [valid, holding, invalid]
    PatternsField:
      type: object
      additionalProperties: false
      required: [key, label, type, required]
      properties:
        key:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,63}$'
        label: {type: string, minLength: 1, maxLength: 120}
        help:
          type: string
          maxLength: 500
          description: Optional concise guidance rendered beside the generated control.
        type: {$ref: '#/components/schemas/PatternsFieldType'}
        required: {type: boolean}
        allowHolding:
          type: boolean
          default: false
          description: For reference and attachment fields, permits missing targets to enter the holding workflow when requested by the validator.
        referenceType:
          allOf:
            - $ref: '#/components/schemas/PatternsRecordType'
          description: Required target record family for reference and attachment fields.
        options:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 160}
          description: Non-empty only for enum fields.
        minimum:
          type: number
          description: Inclusive lower bound for number or money fields.
        maximum:
          type: number
          description: Inclusive upper bound for number or money fields.
        maximumLength:
          type: integer
          minimum: 0
          maximum: 100000
          description: Optional text length bound; zero selects the service default.
        currencyField:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,63}$'
          description: Companion text or enum field containing an ISO 4217 currency code for a money field.
        accessibleLabel:
          type: string
          minLength: 1
          maxLength: 160
          description: Accessible control name and prefix used in field validation messages; defaults to label when omitted on writes.
        csvHeader:
          type: string
          minLength: 1
          maxLength: 160
          description: Header emitted by the CSV template in field order; defaults to key when omitted on writes.
    PatternsTemplate:
      type: object
      additionalProperties: false
      required: [id, recordType, name, version, builtIn, status, fields, createdBy, createdAt]
      properties:
        id: {$ref: '#/components/schemas/PatternsTemplateID'}
        organizationId:
          type: string
          maxLength: 128
          description: Owning organization for custom templates; omitted from code-versioned built-ins.
        recordType: {$ref: '#/components/schemas/PatternsRecordType'}
        name: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 1000}
        version:
          type: integer
          format: int64
          minimum: 1
          description: Immutable schema version used by validation, CSV, and Exchange consumers.
        builtIn:
          type: boolean
          description: Code-versioned templates are immutable and must be copied before customization.
        status: {$ref: '#/components/schemas/PatternsTemplateStatus'}
        fields:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: '#/components/schemas/PatternsField'}
        createdBy: {type: string, minLength: 1, maxLength: 128}
        createdAt: {type: string, format: date-time}
    PatternsTemplateCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PatternsTemplate'}
    CreatePatternsTemplateRequest:
      type: object
      additionalProperties: false
      required: [recordType, name, fields]
      properties:
        id: {$ref: '#/components/schemas/PatternsTemplateID'}
        recordType: {$ref: '#/components/schemas/PatternsRecordType'}
        name: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 1000}
        fields:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: '#/components/schemas/PatternsField'}
    CopyPatternsTemplateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id: {$ref: '#/components/schemas/PatternsTemplateID'}
        name: {type: string, minLength: 1, maxLength: 160}
        description:
          type: string
          maxLength: 1000
          description: Defaults to the source version description when empty.
    CreatePatternsTemplateVersionRequest:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        description:
          type: string
          maxLength: 1000
          description: Defaults to the current version description when empty.
        fields:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: '#/components/schemas/PatternsField'}
    PatternsValues:
      type: object
      description: Provider-neutral values keyed by field key. Values are strings for text, enum, date, attachment, and reference fields; JSON numbers for number fields; and exact integer minor units for money fields.
      maxProperties: 128
      additionalProperties: true
    PatternsValidationRequest:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values: {$ref: '#/components/schemas/PatternsValues'}
        missingReferences:
          type: array
          maxItems: 64
          description: Reference field keys whose resolved target is missing or not visible. This explicit seam lets Exchange perform provider-specific lookups before portable validation.
          items: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,63}$'}
        allowHoldingRecord:
          type: boolean
          default: false
          description: Allows missing references on fields marked allowHolding to produce a holding result instead of an error.
    PatternsFieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Defined field key, or the unrecognized input key for an unknown_field error.
        code: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        message:
          type: string
          minLength: 1
          maxLength: 500
          description: Accessible-label-prefixed correction guidance suitable for inline and summary presentation.
    PatternsHoldingReference:
      type: object
      additionalProperties: false
      required: [field, referenceType]
      properties:
        field: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,63}$'}
        referenceType: {$ref: '#/components/schemas/PatternsRecordType'}
        value:
          type: string
          maxLength: 128
          description: Stable target identity when supplied; omitted when a required reference itself is absent.
    PatternsValidationResult:
      type: object
      additionalProperties: false
      required: [status, normalizedValues, errors, holdingReferences]
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/PatternsValidationStatus'
          description: holding means typed values are otherwise valid but one or more allowed references require reconciliation.
        normalizedValues: {$ref: '#/components/schemas/PatternsValues'}
        errors:
          type: array
          items: {$ref: '#/components/schemas/PatternsFieldError'}
        holdingReferences:
          type: array
          description: Deterministically field-sorted references for the Exchange holding workflow.
          items: {$ref: '#/components/schemas/PatternsHoldingReference'}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code: {type: string}
            message: {type: string}
            correlationId: {type: string}
    Asset:
      type: object
      required: [id, organizationId, name, kind, status, revision, createdAt, updatedAt]
      properties:
        id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        organizationId: {type: string}
        modelId: {$ref: '#/components/schemas/AssetModelID'}
        modelContext: {$ref: '#/components/schemas/AssetModelContext'}
        name: {type: string, minLength: 1, maxLength: 200}
        kind: {$ref: '#/components/schemas/AssetKind'}
        assetTag: {type: string, maxLength: 128}
        serialNumber: {type: string, maxLength: 255}
        hostname: {type: string, maxLength: 253}
        deploymentNotes: {type: string, maxLength: 2000}
        siteId: {$ref: '#/components/schemas/DirectoryReferenceID'}
        buildingId: {$ref: '#/components/schemas/DirectoryReferenceID'}
        roomId: {$ref: '#/components/schemas/DirectoryReferenceID'}
        departmentId: {$ref: '#/components/schemas/DirectoryReferenceID'}
        userId: {$ref: '#/components/schemas/DirectoryReferenceID'}
        status: {$ref: '#/components/schemas/AssetStatus'}
        purchaseDate: {type: string, format: date-time}
        revision: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AssetModelContext:
      type: object
      additionalProperties: false
      description: Immutable model-default snapshot captured when the asset was linked. Later model updates do not rewrite it.
      required: [manufacturer, name, kind, modelRevision, defaultsEffectiveAt, appliedAt, overrides]
      properties:
        manufacturer: {type: string, minLength: 1, maxLength: 120}
        name: {type: string, minLength: 1, maxLength: 160}
        modelNumber: {type: string, maxLength: 120}
        kind: {$ref: '#/components/schemas/AssetKind'}
        vendorIdentifier: {type: string, maxLength: 160}
        specifications:
          type: object
          additionalProperties: {type: string, maxLength: 500}
          maxProperties: 25
        supportUrl: {type: string, format: uri, maxLength: 500}
        warrantyMonths: {type: integer, minimum: 0, maximum: 1200}
        usefulLifeMonths: {type: integer, minimum: 0, maximum: 1200}
        sourceSystemId: {type: string, maxLength: 120}
        sourceRecordId: {type: string, maxLength: 160}
        modelRevision: {type: integer, format: int64, minimum: 1}
        defaultsEffectiveAt: {type: string, format: date-time}
        appliedAt: {type: string, format: date-time}
        overrides:
          type: array
          uniqueItems: true
          items: {type: string, enum: [kind]}
    ResolveAssetIdentifierRequest:
      type: object
      additionalProperties: false
      required: [symbology, value]
      properties:
        symbology: {$ref: '#/components/schemas/AssetIdentifierSymbology'}
        value: {$ref: '#/components/schemas/AssetIdentifierValue'}
    CreateAssetIdentifierRequest:
      type: object
      additionalProperties: false
      required: [symbology, value]
      properties:
        id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        symbology: {$ref: '#/components/schemas/AssetIdentifierSymbology'}
        value: {$ref: '#/components/schemas/AssetIdentifierValue'}
        displayValue: {type: string, maxLength: 512}
        source:
          allOf: [{$ref: '#/components/schemas/AssetIdentifierSource'}]
          default: user_entered
        primary: {type: boolean, default: false}
    ReplaceAssetIdentifierRequest:
      type: object
      additionalProperties: false
      required: [symbology, value, revision]
      properties:
        replacementId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        symbology: {$ref: '#/components/schemas/AssetIdentifierSymbology'}
        value: {$ref: '#/components/schemas/AssetIdentifierValue'}
        displayValue: {type: string, maxLength: 512}
        source:
          allOf: [{$ref: '#/components/schemas/AssetIdentifierSource'}]
          default: user_entered
        revision: {type: integer, format: int64, minimum: 1}
    DeactivateAssetIdentifierRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: {type: integer, format: int64, minimum: 1}
    AssetIdentifier:
      type: object
      additionalProperties: false
      required: [id, organizationId, assetId, symbology, normalizedValue, source, primary, status, revision, createdBy, createdAt, updatedAt]
      properties:
        id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        organizationId: {type: string, minLength: 1, maxLength: 128}
        assetId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        symbology: {$ref: '#/components/schemas/AssetIdentifierSymbology'}
        normalizedValue: {$ref: '#/components/schemas/AssetIdentifierValue'}
        displayValue: {type: string, maxLength: 512}
        source: {$ref: '#/components/schemas/AssetIdentifierSource'}
