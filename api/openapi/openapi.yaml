        kind: {$ref: '#/components/schemas/IdentityKind'}
        displayName: {type: string, minLength: 1, maxLength: 200}
        email: {type: string, format: email, maxLength: 320}
        departmentId: {type: string, pattern: '^[a-f0-9]{32}$'}
        siteId: {type: string, pattern: '^[a-f0-9]{32}$'}
        status: {$ref: '#/components/schemas/RecordStatus'}
        provider: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'}
        providerSubject: {type: string, minLength: 1, maxLength: 255}
        revision: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateIdentityRequest:
      type: object
      additionalProperties: false
      required: [kind, displayName]
      properties:
        kind: {$ref: '#/components/schemas/IdentityKind'}
        displayName: {type: string, minLength: 1, maxLength: 200}
        email:
          type: string
          format: email
          maxLength: 320
          description: Required when kind is person; optional for shared, public, and lab identities.
