# Requirements: REQ-ATLAS-001, REQ-ATLAS-MODELS-001, REQ-ATLAS-CODES-001, REQ-PEOPLE-001, REQ-DIRECTORY-EXPANSION-001, REQ-DIRECTORY-EXPANSION-002, REQ-DIRECTORY-EXPANSION-003, REQ-PATTERNS-001, REQ-THREADS-001, REQ-STORAGE-001, REQ-HORIZON-001, REQ-LEDGER-001, REQ-STACK-001, REQ-SIGNALS-001, REQ-PLATFORM-VALKEY-001, SEC-GUARD-001, SEC-HTTP-001.
openapi: 3.1.0
info:
  title: StewardMesh API
  version: 0.11.0
  description: Requirements-driven inventory, lifecycle, and secure organization management API.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: /
security: []
paths:
  /healthz:
    get:
      summary: Get service health
      operationId: getHealth
      responses:
        '200':
          description: Service health
  /api/v1/auth/bootstrap:
    get:
      summary: Get administrator bootstrap status
      operationId: getAdministratorBootstrapStatus
      tags: [Guard]
      x-requirement: SEC-GUARD-001
      responses:
        '200':
          description: Whether one-time local administrator setup is required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BootstrapStatus'}
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create the first administrator
      operationId: bootstrapAdministrator
      tags: [Guard]
      x-requirement: SEC-GUARD-001
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BootstrapAdministratorRequest'}
      responses:
        '201':
          description: Administrator created and local session established
          headers:
            Set-Cookie:
              description: HttpOnly, SameSite local session cookie; Secure and __Host-prefixed for HTTPS deployments
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionResponse'}
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Administrator bootstrap is already complete
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/login:
    post:
      summary: Sign in with a local account
      operationId: loginLocalAccount
      tags: [Guard]
      x-requirement: SEC-GUARD-001
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Local authentication succeeded
          headers:
            Set-Cookie:
              description: Opaque HttpOnly session cookie
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionResponse'}
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Authentication attempts are temporarily rate limited
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Configured shared login protection is temporarily unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/session:
    get:
      summary: Get the current Guard session
      operationId: getLocalSession
      tags: [Guard]
      x-requirement: SEC-GUARD-001
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      responses:
        '200':
          description: Current principal and a newly rotated synchronized CSRF token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      summary: Sign out the current session
      operationId: logoutLocalSession
      tags: [Guard]
      x-requirement: SEC-GUARD-001
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Session revoked and browser cookie expired
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/oidc/start:
    get:
      summary: Start organization OpenID Connect sign-in
      operationId: startOpenIDConnectLogin
      tags: [Guard]
      x-requirement: SEC-GUARD-001
      responses:
        '303':
          description: Redirect to the configured provider authorization endpoint with state, nonce, and S256 PKCE
          headers:
            Location:
              schema: {type: string, format: uri}
            Set-Cookie:
              description: Short-lived encrypted HttpOnly, SameSite=Lax transaction cookie
              schema: {type: string}
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The one-time local administrator bootstrap must be complete first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: OpenID Connect is disabled or provider initialization is unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/oidc/callback:
    get:
      summary: Complete organization OpenID Connect sign-in
      operationId: completeOpenIDConnectLogin
      tags: [Guard]
      x-requirement: SEC-GUARD-001
      parameters:
        - in: query
          name: state
          required: true
          schema: {type: string, minLength: 32, maxLength: 128}
        - in: query
          name: code
          required: false
          schema: {type: string, minLength: 1, maxLength: 4096}
        - in: query
          name: error
          required: false
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        '303':
          description: Redirect to the fixed configured application origin after establishing a Guard session or reporting a generic failure
          headers:
            Location:
              schema: {type: string, format: uri}
            Set-Cookie:
              description: Opaque Guard session cookie on success and an expired OIDC transaction cookie on every callback
              schema: {type: string}
        '503':
          description: OpenID Connect is disabled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/saml/metadata:
    get:
      summary: Get SAML service-provider metadata
      operationId: getSAMLServiceProviderMetadata
      tags: [Guard]
      x-requirement: SEC-GUARD-001
      responses:
        '200':
          description: Signed-request-capable SAML 2.0 service-provider metadata
          content:
            application/samlmetadata+xml:
              schema: {type: string}
        '404':
          description: SAML is disabled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: SAML metadata is unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/saml/start:
    get:
      summary: Start organization SAML sign-in
      operationId: startSAMLLogin
      tags: [Guard]
      x-requirement: SEC-GUARD-001
      responses:
        '303':
          description: Redirect to the configured IdP HTTP-Redirect SSO endpoint with a signed AuthnRequest and opaque RelayState
          headers:
            Location:
              schema: {type: string, format: uri}
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The one-time local administrator bootstrap must be complete first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: SAML is disabled, unavailable, or request tracking failed closed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/saml/acs:
    post:
      summary: Complete organization SAML sign-in
      operationId: completeSAMLLogin
      tags: [Guard]
      x-requirement: SEC-GUARD-001
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [RelayState, SAMLResponse]
              properties:
                RelayState: {type: string, minLength: 32, maxLength: 80}
                SAMLResponse: {type: string, format: byte, minLength: 1}
      responses:
        '303':
          description: Redirect to the fixed configured application origin after establishing a Guard session or reporting a generic failure
          headers:
            Location:
              schema: {type: string, format: uri}
            Set-Cookie:
              description: Opaque Guard session cookie on success
              schema: {type: string}
        '503':
          description: SAML is disabled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/guard/access:
    get:
      summary: List Guard accounts, roles, and scoped assignments
      operationId: listGuardAccess
      tags: [Guard]
      x-requirement: SEC-GUARD-001
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      responses:
        '200':
          description: Organization authorization directory for Guard administrators
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuardAccessDirectory'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/guard/roles:
    post:
      summary: Create a local custom role
      operationId: createGuardRole
      tags: [Guard]
      x-requirement: SEC-GUARD-001
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateGuardRoleRequest'}
      responses:
        '201':
          description: Custom role created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuardRole'}
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/guard/role-assignments:
    post:
      summary: Create a local scoped role assignment
      operationId: createGuardRoleAssignment
      tags: [Guard]
      x-requirement: SEC-GUARD-001
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateGuardRoleAssignmentRequest'}
      responses:
        '201':
          description: Scoped role assignment created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuardRoleAssignment'}
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/guard/role-assignments/{assignmentId}:
    delete:
      summary: Remove a local scoped role assignment
      operationId: deleteGuardRoleAssignment
      tags: [Guard]
      x-requirement: SEC-GUARD-001
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      parameters:
        - in: path
          name: assignmentId
          required: true
          schema: {type: string, pattern: '^[a-f0-9]{32}$'}
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Local role assignment removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The assignment is provider-managed or is the last active organization administrator
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/guard/resource-ownership:
    get:
      summary: List imported resource ownership and write-lock state
      operationId: listGuardResourceOwnership
      tags: [Guard]
      x-requirement: SEC-GUARD-001
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      responses:
        '200':
          description: Organization resource ownership registry for Guard administrators
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuardResourceOwnershipCollection'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Register an externally owned resource with a write lock
      operationId: registerGuardResourceOwnership
      tags: [Guard]
      x-requirement: SEC-GUARD-001
      description: Re-registering the same source identity is idempotent and never restores a lock after ownership has been claimed.
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterGuardResourceOwnershipRequest'}
      responses:
        '200':
          description: Existing matching ownership record returned without changing its claim state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuardResourceOwnership'}
        '201':
          description: External ownership registered and write lock applied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuardResourceOwnership'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/guard/resource-ownership/{resourceType}/{resourceId}/claim:
    post:
      summary: Claim local ownership and remove a resource write lock
      operationId: claimGuardResourceOwnership
      tags: [Guard]
      x-requirement: SEC-GUARD-001
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      parameters:
        - in: path
          name: resourceType
          required: true
          schema: {type: string, pattern: '^[a-z][a-z0-9_.-]{0,63}$'}
        - in: path
          name: resourceId
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Local ownership claimed and write lock removed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuardResourceOwnership'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/organization:
    get:
      summary: Get the configured organization
      operationId: getOrganization
      tags: [Foundation]
      x-requirement: REQ-FOUNDATION-001
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      parameters:
        - in: header
          name: X-Correlation-ID
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Configured organization ownership boundary
          headers:
            X-Correlation-ID:
              description: Validated or server-generated request correlation identifier
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/templates:
    get:
      summary: List Patterns templates
      operationId: listPatternsTemplates
      tags: [Patterns]
      x-requirement: REQ-PATTERNS-001
      description: Returns immutable built-in templates and organization-owned template versions for form generation, imports, and Exchange discovery.
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      parameters:
        - in: query
          name: recordType
          required: false
          description: Exact provider-neutral record family to return.
          schema: {$ref: '#/components/schemas/PatternsRecordType'}
        - in: query
          name: includeRetired
          required: false
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Versioned template collection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatternsTemplateCollection'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      summary: Create a custom Patterns template
      operationId: createPatternsTemplate
      tags: [Patterns]
      x-requirement: REQ-PATTERNS-001
      description: Creates immutable version 1 of an organization-owned template. Requires the Guard management permission.
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePatternsTemplateRequest'}
      responses:
        '201':
          description: Custom template version created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatternsTemplate'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/PatternsTemplateID'
      - $ref: '#/components/parameters/PatternsVersion'
    get:
      summary: Get a Patterns template version
      operationId: getPatternsTemplate
      tags: [Patterns]
      x-requirement: REQ-PATTERNS-001
      description: Returns the requested immutable version, or the latest version when version is omitted.
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      responses:
        '200':
          description: Exact template identity, version metadata, and field schema
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatternsTemplate'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/templates/{templateId}/schema:
    parameters:
      - $ref: '#/components/parameters/PatternsTemplateID'
      - $ref: '#/components/parameters/PatternsVersion'
    get:
      summary: Get a Patterns schema version
      operationId: getPatternsTemplateSchema
      tags: [Patterns]
      x-requirement: REQ-PATTERNS-001
      description: Stable discovery seam for generated forms, CSV tooling, and Exchange. Returns the same provider-neutral, versioned template contract as the detail endpoint.
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      responses:
        '200':
          description: Exact versioned schema with help, accessible-label, and CSV metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatternsTemplate'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/templates/{templateId}/copy:
    parameters:
      - $ref: '#/components/parameters/PatternsTemplateID'
      - $ref: '#/components/parameters/PatternsVersion'
    post:
      summary: Copy a Patterns template version
      operationId: copyPatternsTemplate
      tags: [Patterns]
      x-requirement: REQ-PATTERNS-001
      description: Copies the selected immutable source version into version 1 of a new organization-owned template. Requires the Guard management permission.
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CopyPatternsTemplateRequest'}
      responses:
        '201':
          description: Copied custom template created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatternsTemplate'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/templates/{templateId}/versions:
    parameters:
      - $ref: '#/components/parameters/PatternsTemplateID'
    post:
      summary: Create a Patterns template version
      operationId: createPatternsTemplateVersion
      tags: [Patterns]
      x-requirement: REQ-PATTERNS-001
      description: Appends the next immutable version to a custom template; built-in templates cannot be versioned through the API. Requires the Guard management permission.
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePatternsTemplateVersionRequest'}
      responses:
        '201':
          description: New immutable template version created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatternsTemplate'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/templates/{templateId}/validate:
    parameters:
      - $ref: '#/components/parameters/PatternsTemplateID'
      - $ref: '#/components/parameters/PatternsVersion'
    post:
      summary: Validate record values against a Patterns version
      operationId: validatePatternsRecord
      tags: [Patterns]
      x-requirement: REQ-PATTERNS-001
      description: Provider-neutral validation seam shared by interactive forms and Exchange package rows. Missing allowed references may produce a holding result instead of invalidating the row.
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatternsValidationRequest'}
      responses:
        '200':
          description: Deterministic valid, holding, or invalid result with normalized values
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatternsValidationResult'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/templates/{templateId}/template.csv:
    parameters:
      - $ref: '#/components/parameters/PatternsTemplateID'
      - $ref: '#/components/parameters/PatternsVersion'
    get:
      summary: Export a Patterns CSV header template
      operationId: exportPatternsCSVTemplate
      tags: [Patterns]
      x-requirement: REQ-PATTERNS-001
      description: Emits one RFC 4180-compatible header row in field order using each field's csvHeader metadata.
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      responses:
        '200':
          description: CSV import template for the resolved immutable version
          headers:
            Content-Disposition:
              description: Attachment filename containing the template identity and resolved version.
              schema: {type: string}
          content:
            text/csv:
              schema: {type: string}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/asset-identifiers/resolve:
    post:
      summary: Resolve an active asset identifier
      operationId: resolveAssetIdentifier
      tags: [Atlas Codes]
      x-requirement: REQ-ATLAS-CODES-001
      description: Resolves an active identifier without placing the encoded value in a URL or access log, including credential-free `/atlas/codes/{opaqueIdentifierId}` routes emitted by QR label templates. It then authorizes the matched asset against the caller's organization, site, department, or resource-scoped assets.read grants. Unknown and unauthorized values return the same not-found response.
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveAssetIdentifierRequest'}
      responses:
        '200':
          description: Active identifier association
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssetIdentifier'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/asset-label-templates:
    get:
      summary: List versioned Atlas Codes label templates
