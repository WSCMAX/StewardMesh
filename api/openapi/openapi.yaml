        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/directory-imports/{batchID}/apply:
    post:
      summary: Apply a directory import preview
      operationId: applyDirectoryImport
      tags: [Bridge]
      x-requirement: REQ-DIRECTORY-EXPANSION-002
      x-required-permission: integrations.write
      description: |
        Requires organization-scoped `integrations.write`. Applies only the exact immutable plan
        persisted by preview; it never re-pulls the provider and accepts no replacement records or
        mappings. Conflicts remain visible instead of silently overwriting local or externally
        owned records. Safe retries with the same idempotency key return the original attempt.
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/DirectoryImportBatchID'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/DirectoryImportIdempotencyKey'
      responses:
        '200':
          description: Applied, partially applied, failed, or safely replayed persisted plan
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DirectoryImportOperationResult'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The batch is not in the previewed state, is already running, reached the 100-attempt history limit, or the idempotency key conflicts with another operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/directory-imports/{batchID}/retry:
    post:
      summary: Retry a directory import attempt
      operationId: retryDirectoryImport
      tags: [Bridge]
      x-requirement: REQ-DIRECTORY-EXPANSION-002
      x-required-permission: integrations.write
      description: |
        Requires organization-scoped `integrations.write`. Retries only retryable failed actions
        from the exact persisted plan and preserves all earlier outcomes and attempts. After a
        successful preview, retry never re-pulls the source. A transient connector failure that
        prevented plan creation may resume the same failed batch using its pinned configuration
        revision and durably install the recovered plan. Retry never accepts amended records,
        mappings, or provider payloads.
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/DirectoryImportBatchID'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/DirectoryImportIdempotencyKey'
      responses:
        '200':
          description: Retried or safely replayed persisted plan with complete attempt history
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DirectoryImportOperationResult'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The batch has no retryable failed actions, is already running, reached the 100-attempt history limit, or the idempotency key conflicts with another operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
