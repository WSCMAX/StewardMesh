    RoomCollection:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Room'}}
    DirectoryImportBatchID:
      type: string
      pattern: '^[a-f0-9]{32}$'
    DirectoryImportSourceSystemID:
      type: string
      description: Stable provider-neutral identity of a configured read-only source system.
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    DirectoryImportProvider:
      type: string
      description: Provider adapter name recorded for operations and audit; the stable contract remains source-system neutral.
      pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
    DirectoryImportSource:
      type: object
      additionalProperties: false
      description: Credential-free identity of one server-configured read-only directory connector.
      required: [id, provider, configRevision]
      properties:
        id: {$ref: '#/components/schemas/DirectoryImportSourceSystemID'}
        provider: {$ref: '#/components/schemas/DirectoryImportProvider'}
        configRevision: {type: string, minLength: 1, maxLength: 128}
    DirectoryImportSourceCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/DirectoryImportSource'}
    DirectoryImportBatchStatus:
      type: string
      enum: [previewed, applying, applied, partially_applied, failed]
    DirectoryImportAction:
      type: string
      description: Immutable action selected while the bounded source snapshot is previewed.
      enum: [create, update, deactivate, unchanged, conflict]
    DirectoryImportOutcome:
      type: string
      description: Durable reconciliation outcome for one immutable planned action.
      enum: [pending, applied, unchanged, conflict, failed]
    DirectoryImportOperation:
      type: string
      enum: [preview, apply, retry]
    DirectoryImportFailureClass:
      type: string
      enum: [transient, permanent, conflict]
    PreviewDirectoryImportRequest:
      type: object
      additionalProperties: false
      description: Selects a server-configured source. Provider records, credentials, mappings, and payloads are never accepted from the caller.
      required: [sourceSystemId]
      properties:
        sourceSystemId: {$ref: '#/components/schemas/DirectoryImportSourceSystemID'}
    DirectoryImportCounts:
      type: object
      additionalProperties: false
      required: [created, updated, unchanged, deactivated, conflicts, failed]
      properties:
        created: {type: integer, minimum: 0, maximum: 5000}
        updated: {type: integer, minimum: 0, maximum: 5000}
        unchanged: {type: integer, minimum: 0, maximum: 5000}
        deactivated: {type: integer, minimum: 0, maximum: 5000}
        conflicts: {type: integer, minimum: 0, maximum: 5000}
        failed: {type: integer, minimum: 0, maximum: 5000}
    DirectoryImportRecord:
      type: object
      additionalProperties: false
      description: Bounded normalized record safe for reconciliation detail. It contains only an allowlisted directory attribute projection and group source references, never raw provider payloads, endpoints, credentials, or internal mapping digests.
      required: [sourceRecordId, kind, displayName, status]
      properties:
        sourceRecordId: {type: string, minLength: 1, maxLength: 255}
        kind:
          type: string
          enum: [identity]
        identityKind:
          type: string
          enum: [person, shared, public, lab]
        displayName: {type: string, minLength: 1, maxLength: 200}
        email: {type: string, format: email, maxLength: 320}
        status:
          type: string
          enum: [active, inactive]
        department: {type: string, maxLength: 200}
        directoryAttributes:
          type: object
          maxProperties: 16
          additionalProperties: {type: string, minLength: 1, maxLength: 500}
        groupSourceIds:
          type: array
          maxItems: 256
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 255}
    DirectoryImportItem:
      type: object
      additionalProperties: false
      description: Mapping-safe item from the exact persisted plan. Internal source/target digests and authoritative mapping rows are not returned.
      required: [id, ordinal, record, action, outcome, updatedAt]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{32}$'}
        ordinal: {type: integer, minimum: 0, maximum: 4999}
        record: {$ref: '#/components/schemas/DirectoryImportRecord'}
        targetId: {$ref: '#/components/schemas/DirectoryImportBatchID'}
        expectedRevision: {type: integer, format: int64, minimum: 1}
        action: {$ref: '#/components/schemas/DirectoryImportAction'}
        outcome: {$ref: '#/components/schemas/DirectoryImportOutcome'}
        failureClass: {$ref: '#/components/schemas/DirectoryImportFailureClass'}
        retryable: {type: boolean}
        error:
          type: string
          maxLength: 240
          description: Sanitized conflict or failure guidance without raw provider content.
        updatedAt: {type: string, format: date-time}
    DirectoryImportAttempt:
      type: object
      additionalProperties: false
      description: Immutable preview, apply, or retry history. Raw and digested idempotency keys and request fingerprints are not returned.
      required: [id, operation, number, status, correlationId, startedAt]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{32}$'}
        number: {type: integer, minimum: 1, maximum: 100}
        operation: {$ref: '#/components/schemas/DirectoryImportOperation'}
        status: {$ref: '#/components/schemas/DirectoryImportBatchStatus'}
        failureClass: {$ref: '#/components/schemas/DirectoryImportFailureClass'}
        retryable: {type: boolean}
        error:
          type: string
          maxLength: 240
          description: Sanitized failure guidance.
        correlationId: {type: string, minLength: 1, maxLength: 128}
        startedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
    DirectoryImportBatch:
      type: object
      additionalProperties: false
      description: Durable organization-owned preview and reconciliation summary. PostgreSQL or another authoritative store owns this state; Valkey never does.
      required: [id, sourceSystemId, provider, configRevision, status, completeSnapshot, counts, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/DirectoryImportBatchID'}
        sourceSystemId: {$ref: '#/components/schemas/DirectoryImportSourceSystemID'}
        provider: {$ref: '#/components/schemas/DirectoryImportProvider'}
        configRevision: {type: string, minLength: 1, maxLength: 128}
        status: {$ref: '#/components/schemas/DirectoryImportBatchStatus'}
        completeSnapshot:
          type: boolean
          description: Whether the connector declared the bounded snapshot complete. Missing-source deactivations are planned only when true.
        counts: {$ref: '#/components/schemas/DirectoryImportCounts'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
    DirectoryImportBatchDetail:
      type: object
      additionalProperties: false
      description: Complete mapping-safe item plan and append-only attempt history for one batch.
      required: [batch, items, attempts]
      properties:
        batch: {$ref: '#/components/schemas/DirectoryImportBatch'}
        items:
          type: array
          maxItems: 5000
          items: {$ref: '#/components/schemas/DirectoryImportItem'}
        attempts:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/DirectoryImportAttempt'}
    DirectoryImportOperationResult:
      type: object
      additionalProperties: false
      required: [batch, replay]
      properties:
        batch: {$ref: '#/components/schemas/DirectoryImportBatch'}
        replay:
          type: boolean
          description: True when this exact idempotent operation returned its original persisted result.
    DirectoryImportBatchPage:
      type: object
      additionalProperties: false
      required: [batches]
      properties:
        batches:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/DirectoryImportBatch'}
        nextCursor: {$ref: '#/components/schemas/DirectoryImportBatchID'}
    Department:
      type: object
      required: [id, organizationId, name, status, revision, createdAt, updatedAt]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{32}$'}
        organizationId: {type: string, minLength: 1, maxLength: 128}
        name: {type: string, minLength: 1, maxLength: 200}
        siteId: {type: string, pattern: '^[a-f0-9]{32}$'}
        status: {$ref: '#/components/schemas/RecordStatus'}
        revision: {type: integer, minimum: 1}
