  /api/v1/directory-imports/preview:
    post:
      summary: Preview a directory import
      operationId: previewDirectoryImport
      tags: [Bridge]
      x-requirement: REQ-DIRECTORY-EXPANSION-002
      x-required-permission: integrations.write
      description: |
        Requires organization-scoped `integrations.write`. Pulls one configured read-only
        source, normalizes a snapshot bounded to 100 pages and a 5,000-item plan,
        and durably stores an immutable reconciliation
        plan without mutating directory records. Neither the request nor the response accepts
        or exposes raw provider payloads. Reusing the same idempotency key with the same source
        returns the original preview; reusing it for another source is a conflict.
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/DirectoryImportIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreviewDirectoryImportRequest'}
      responses:
        '201':
          description: New or safely replayed immutable preview plan
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DirectoryImportOperationResult'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: The configured source system was not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: The idempotency key was already used for a different preview request, or the bounded source snapshot could not be planned safely
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
