      description: Lists active physical label definitions derived directly from immutable Patterns `atlas.label-template` versions. Each definition exposes configured dimensions, margins, quiet zones, credential-free payload source, human-readable text, organization branding, and the explicit safe asset-field allowlist. At least one assets.read grant in the current organization is required, including a site, department, or resource-scoped grant.
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      responses:
        '200':
          description: Available Code 128 and QR label definitions and output bounds
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssetLabelTemplateCollection'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/asset-label-batches:
    post:
      summary: Generate a bounded print-ready label artifact
      operationId: createAssetLabelBatch
      tags: [Atlas Codes]
      x-requirement: REQ-ATLAS-CODES-001
      description: Generates one label or a bounded selected batch without creating or changing identifier associations. Every selected asset is rechecked for current assets.read, assets.write, matching scope, and imported-resource ownership before cached or newly rendered bytes are returned. Within the bounded replay window, repeating the exact request with the same idempotency key returns identical snapshot bytes and reusing a key for different input is rejected; an expired replay requires a new key. Request cancellation stops generation. SVG is a one-label vector browser/OS artifact, PDF preserves one physical page per selected label, and ZPL preserves one device label per selection as an escaped provider adapter file that never contacts or silently selects a printer. Printable label text is bounded ASCII across all three renderers so no output silently substitutes unsupported characters.
      security: [{localCookieAuth: []}, {secureCookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - in: header
          name: Idempotency-Key
          required: true
          description: Stable retry key scoped to this authenticated organization; 1–128 safe identifier characters.
          schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAssetLabelBatchRequest'}
      responses:
        '200':
          description: Print-ready vector/PDF output or an operator-controlled ZPL adapter file
          headers:
            Content-Disposition: {description: Inline browser review for SVG/PDF or attachment for ZPL., schema: {type: string}}
            X-Label-Batch-ID: {description: Deterministic batch identity for this exact input., schema: {type: string}}
            X-Label-Template-Version: {description: Resolved immutable Patterns-backed template version., schema: {type: integer, format: int64, minimum: 1}}
            X-Label-Width-MM: {description: Physical width of each label in millimeters., schema: {type: number, format: double, minimum: 12, maximum: 300}}
            X-Label-Height-MM: {description: Physical height of each label in millimeters., schema: {type: number, format: double, minimum: 12, maximum: 300}}
            X-Label-Item-Count: {description: Number of labels in the bounded artifact., schema: {type: integer, minimum: 1, maximum: 50}}
            X-Content-SHA256: {description: SHA-256 digest of the exact returned artifact bytes., schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
            X-Idempotent-Replay: {description: True when returning an exact prior result for the same request key., schema: {type: boolean}}
          content:
            image/svg+xml:
              schema: {type: string, format: binary}
            application/pdf:
              schema: {type: string, format: binary}
            application/vnd.zebra-zpl:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '423': {$ref: '#/components/responses/Locked'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
