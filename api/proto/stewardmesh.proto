// Requirement: REQ-HORIZON-001. Feature: lifecycle.planning.
message HorizonPlan {
  string id = 1;
  string organization_id = 2;
  string asset_id = 3;
  string scenario = 4;
  int32 expected_useful_life_months = 5;
  google.protobuf.Timestamp replacement_date = 6;
  google.protobuf.Timestamp derived_replacement_date = 7;
  // One of planned, in_service, refresh_due, approved, or retired.
  string lifecycle_stage = 8;
  // Exact minor units from 0 through 9007199254740991.
  int64 replacement_cost_minor = 9;
  string currency = 10;
  google.protobuf.Timestamp effective_from = 11;
  int64 revision = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

message HorizonPlanVersion {
  string plan_id = 1;
  string organization_id = 2;
  string asset_id = 3;
  string scenario = 4;
  int32 expected_useful_life_months = 5;
  google.protobuf.Timestamp replacement_date = 6;
  // One of planned, in_service, refresh_due, approved, or retired.
  string lifecycle_stage = 7;
  // Exact minor units from 0 through 9007199254740991.
  int64 replacement_cost_minor = 8;
  string currency = 9;
  google.protobuf.Timestamp effective_from = 10;
  int64 revision = 11;
  string actor_id = 12;
  google.protobuf.Timestamp recorded_at = 13;
  google.protobuf.Timestamp derived_replacement_date = 14;
}

