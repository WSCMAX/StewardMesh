message ListBridgeClientsRequest {
  // Stable client ID returned as next_cursor by the preceding page.
  string cursor = 1;
  // Zero defaults to 25; valid values are 1 through 100.
  int32 limit = 2;
}

message ListBridgeClientsResponse {
  repeated BridgeClient items = 1;
  string next_cursor = 2;
}

message CreateBridgeClientRequest {
  string name = 1;
  repeated string redirect_uris = 2;
  repeated BridgeScope allowed_scopes = 3;
}

message RevokeBridgeClientRequest {
  string client_id = 1;
}

// Provider-neutral Bridge administration record.
// Requirements: REQ-API-001, SEC-MCP-001. Feature: integrations.protocols.
message BridgeClient {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  repeated string redirect_uris = 4;
  repeated BridgeScope allowed_scopes = 5;
  string created_by = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp revoked_at = 8;
}

enum BridgeScope {
  BRIDGE_SCOPE_UNSPECIFIED = 0;
  BRIDGE_SCOPE_MCP_RESOURCES = 1;
  BRIDGE_SCOPE_ASSETS_READ = 2;
  BRIDGE_SCOPE_DIRECTORY_READ = 3;
  BRIDGE_SCOPE_SIGNALS_READ = 4;
  BRIDGE_SCOPE_SIGNALS_ACKNOWLEDGE = 5;
}

message ListBridgeGrantsRequest {
  // Stable grant ID returned as next_cursor by the preceding page.
  string cursor = 1;
  // Zero defaults to 25; valid values are 1 through 100.
  int32 limit = 2;
}

message ListBridgeGrantsResponse {
  repeated BridgeGrant items = 1;
  string next_cursor = 2;
}

message RevokeBridgeGrantRequest {
  string grant_id = 1;
}

message BridgeGrant {
  string id = 1;
  string organization_id = 2;
  string client_id = 3;
  string client_name = 4;
  string actor_id = 5;
  string resource_uri = 6;
  repeated BridgeScope scopes = 7;
  google.protobuf.Timestamp access_expires_at = 8;
  google.protobuf.Timestamp refresh_expires_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp last_used_at = 11;
  google.protobuf.Timestamp revoked_at = 12;
}
