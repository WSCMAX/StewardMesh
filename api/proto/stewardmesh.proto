  repeated string scenarios = 1;
  google.protobuf.Timestamp as_of = 2;
  int32 from_year = 3;
  int32 to_year = 4;
  int32 fiscal_year_start_month = 5;
  // One of fiscal_year, department, site, tag, goal, or asset_class.
  string group_by = 6;
}

message HorizonForecastGroup {
  string key = 1;
  string label = 2;
  string scenario = 3;
  // Exact minor units from 0 through 9007199254740991.
  int64 planned_replacement_minor = 4;
  int32 asset_count = 5;
  // Each value is exact minor units from 0 through 9007199254740991.
  map<string, int64> amounts_by_kind_minor = 6;
}

message HorizonForecast {
  google.protobuf.Timestamp as_of = 1;
  string group_by = 2;
  string currency = 3;
  repeated string scenarios = 4;
  // Exact minor units from 0 through 9007199254740991.
  int64 planned_replacement_minor = 5;
  int32 asset_count = 6;
  // Each value is exact minor units from 0 through 9007199254740991.
  map<string, int64> totals_by_kind_minor = 7;
  repeated HorizonForecastGroup groups = 8;
}

