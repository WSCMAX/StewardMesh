message SearchIdentitiesRequest {
  string query = 1;
  IdentityKind kind = 2;
  RecordStatus status = 3;
  string department_id = 4;
  string site_id = 5;
  uint32 limit = 6;
}

message SearchIdentitiesResponse {
  repeated DirectoryIdentity items = 1;
}

message CreateIdentityRequest {
  IdentityKind kind = 1;
  string display_name = 2;
  string email = 3;
  string department_id = 4;
  string site_id = 5;
  RecordStatus status = 6;
  string provider = 7;
  string provider_subject = 8;
}

message DirectoryIdentity {
  string id = 1;
  string organization_id = 2;
  IdentityKind kind = 3;
  string display_name = 4;
  string email = 5;
  string department_id = 6;
  string site_id = 7;
  RecordStatus status = 8;
  string provider = 9;
  string provider_subject = 10;
  uint64 revision = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message ListAssetAssignmentsRequest {
