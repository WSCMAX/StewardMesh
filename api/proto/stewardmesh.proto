syntax = "proto3";

package stewardmesh.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/maxlemke/stewardmesh/api/proto;stewardmeshv1";

// Requirement: REQ-FOUNDATION-001.
service FoundationService {
  rpc GetOrganization(GetOrganizationRequest) returns (Organization);
}

// Guard authentication contract. OpenID Connect authorization-code redirects
// remain browser HTTP endpoints; their JIT accounts use this same principal
// and session boundary after callback verification.
// Secure transport and metadata behavior: SEC-HTTP-001.
service GuardService {
  rpc GetBootstrapStatus(GetBootstrapStatusRequest) returns (BootstrapStatus);
  rpc BootstrapAdministrator(BootstrapAdministratorRequest) returns (AuthenticationSession);
  rpc AuthenticateLocal(AuthenticateLocalRequest) returns (AuthenticationSession);
  rpc GetSession(GetSessionRequest) returns (AuthenticationSession);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc ListGuardAccess(ListGuardAccessRequest) returns (ListGuardAccessResponse);
  rpc CreateRole(CreateRoleRequest) returns (GuardRole);
  rpc CreateRoleAssignment(CreateRoleAssignmentRequest) returns (GuardRoleAssignment);
  rpc DeleteRoleAssignment(DeleteRoleAssignmentRequest) returns (DeleteRoleAssignmentResponse);
  rpc ListResourceOwnership(ListResourceOwnershipRequest) returns (ListResourceOwnershipResponse);
  rpc RegisterResourceOwnership(RegisterResourceOwnershipRequest) returns (GuardResourceOwnership);
  rpc ClaimResourceOwnership(ClaimResourceOwnershipRequest) returns (GuardResourceOwnership);
}

// Authenticated Guard RPCs carry the opaque session bearer in gRPC
// authorization metadata. The bearer is never repeated in request bodies.

// Requirement: REQ-ATLAS-001. Feature: inventory.assets.
service AssetService {
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse);
  rpc GetAsset(GetAssetRequest) returns (Asset);
  rpc CreateAsset(CreateAssetRequest) returns (Asset);
  rpc UpdateAsset(UpdateAssetRequest) returns (Asset);
  rpc ListAssetLifecycle(ListAssetLifecycleRequest) returns (ListAssetLifecycleResponse);
}

// People directory and effective-dated asset assignments.
// Requirements: REQ-PEOPLE-001, REQ-DIRECTORY-EXPANSION-001.
// Feature: identity.directory.
// Directory visibility is derived from authenticated Guard grants and is
// never accepted from client-provided request fields.
service PeopleService {
  rpc ListSites(ListSitesRequest) returns (ListSitesResponse);
  rpc CreateSite(CreateSiteRequest) returns (Site);
  rpc ListBuildings(ListBuildingsRequest) returns (ListBuildingsResponse);
  rpc CreateBuilding(CreateBuildingRequest) returns (Building);
  rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse);
  rpc CreateRoom(CreateRoomRequest) returns (Room);
  rpc ListDepartments(ListDepartmentsRequest) returns (ListDepartmentsResponse);
  rpc CreateDepartment(CreateDepartmentRequest) returns (Department);
  rpc SearchIdentities(SearchIdentitiesRequest) returns (SearchIdentitiesResponse);
  rpc CreateIdentity(CreateIdentityRequest) returns (DirectoryIdentity);
  rpc ListAssetAssignments(ListAssetAssignmentsRequest) returns (ListAssetAssignmentsResponse);
  rpc CreateAssetAssignment(CreateAssetAssignmentRequest) returns (AssetAssignment);
  rpc EndAssetAssignment(EndAssetAssignmentRequest) returns (AssetAssignment);
}

// Organization-scoped tag and goal hierarchies with explicit inheritance
// provenance. Requirement: REQ-THREADS-001. Feature: goals.tags.
service ThreadsService {
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc GetTag(GetTagRequest) returns (Tag);
  rpc CreateTag(CreateTagRequest) returns (Tag);
  rpc UpdateTag(UpdateTagRequest) returns (Tag);
  rpc ListGoals(ListGoalsRequest) returns (ListGoalsResponse);
  rpc GetGoal(GetGoalRequest) returns (Goal);
  rpc CreateGoal(CreateGoalRequest) returns (Goal);
  rpc UpdateGoal(UpdateGoalRequest) returns (Goal);
  rpc ListEffectiveTags(ListEffectiveTagsRequest) returns (ListEffectiveTagsResponse);
  rpc SetTagRule(SetTagRuleRequest) returns (TagRule);
  rpc DeleteTagRule(DeleteTagRuleRequest) returns (DeleteTagRuleResponse);
  rpc ListGoalLinks(ListGoalLinksRequest) returns (ListGoalLinksResponse);
  rpc LinkGoal(LinkGoalRequest) returns (GoalLink);
  rpc UnlinkGoal(UnlinkGoalRequest) returns (UnlinkGoalResponse);
}

// Private object storage with durable metadata and short-lived access.
// Requirement: REQ-STORAGE-001. Feature: storage.blobs.
service VaultService {
  rpc ListBlobs(ListBlobsRequest) returns (ListBlobsResponse);
  rpc GetBlob(GetBlobRequest) returns (VaultBlob);
  rpc CreateBlob(CreateBlobRequest) returns (VaultBlob);
  rpc DownloadBlob(DownloadBlobRequest) returns (VaultBlobContent);
  rpc AuthorizeDownload(AuthorizeBlobDownloadRequest) returns (VaultDownloadAuthorization);
}

message GetOrganizationRequest {}

message Organization {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

// Requirement: SEC-GUARD-001.
message GetBootstrapStatusRequest {}

message BootstrapStatus {
  bool required = 1;
  bool token_required = 2;
  uint32 minimum_password_characters = 3;
  bool oidc_enabled = 4;
  bool saml_enabled = 5;
}

message BootstrapAdministratorRequest {
  string username = 1;
  string email = 2;
  string display_name = 3;
  string password = 4;
  string bootstrap_token = 5;
}

message AuthenticateLocalRequest {
  string username = 1;
  string password = 2;
}

message GetSessionRequest {}

message LogoutRequest {
  string csrf_token = 1;
}

message LogoutResponse {}

message AuthenticationSession {
  Principal principal = 1;
  string session_token = 2;
  string csrf_token = 3;
  google.protobuf.Timestamp expires_at = 4;
  repeated string permissions = 5;
}

message Principal {
  string subject = 1;
  string organization_id = 2;
  string username = 3;
  string email = 4;
  string display_name = 5;
  repeated string roles = 6;
}

message AuthorizationScope {
  string kind = 1;
  string organization_id = 2;
  string resource_id = 3;
}

message PermissionGrant {
  string permission = 1;
  AuthorizationScope scope = 2;
}

message ListGuardAccessRequest {}

message ListGuardAccessResponse {
  repeated GuardAccount accounts = 1;
  repeated GuardRole roles = 2;
  repeated GuardRoleAssignment assignments = 3;
  repeated GuardPolicyBundle policy_bundles = 4;
  repeated string available_permissions = 5;
}

message GuardAccount {
  string id = 1;
  string username = 2;
  string email = 3;
  string display_name = 4;
  string status = 5;
}

message GuardRole {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string permissions = 4;
  repeated string policy_bundle_ids = 5;
  string source = 6;
  bool managed = 7;
}

message GuardPolicyBundle {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string permissions = 4;
}

message CreateRoleRequest {
  string name = 1;
  string description = 2;
  repeated string permissions = 3;
  repeated string policy_bundle_ids = 4;
  string csrf_token = 5;
}

message GuardRoleAssignment {
  string id = 1;
  string account_id = 2;
  string role_id = 3;
  AuthorizationScope scope = 4;
  string source = 5;
  bool managed = 6;
  google.protobuf.Timestamp created_at = 7;
}

message CreateRoleAssignmentRequest {
  string account_id = 1;
  string role_id = 2;
  AuthorizationScope scope = 3;
  string csrf_token = 4;
}

message DeleteRoleAssignmentRequest {
  string assignment_id = 1;
  string csrf_token = 2;
}

message DeleteRoleAssignmentResponse {}

message ListResourceOwnershipRequest {}

message ListResourceOwnershipResponse {
  repeated GuardResourceOwnership items = 1;
}

message GuardResourceOwnership {
  string resource_type = 1;
  string resource_id = 2;
  string source_system_id = 3;
  string source_record_id = 4;
  bool write_locked = 5;
  google.protobuf.Timestamp registered_at = 6;
  string claimed_by = 7;
  google.protobuf.Timestamp claimed_at = 8;
}

message RegisterResourceOwnershipRequest {
  string resource_type = 1;
  string resource_id = 2;
  string source_system_id = 3;
  string source_record_id = 4;
  string csrf_token = 5;
}

message ClaimResourceOwnershipRequest {
  string resource_type = 1;
  string resource_id = 2;
  string csrf_token = 3;
}

message ListAssetsRequest {
  string search = 1;
  string kind = 2;
  string status = 3;
  string site_id = 4;
  string department_id = 5;
  string user_id = 6;
  int32 limit = 7;
}

message ListAssetsResponse {
  repeated Asset items = 1;
}

message CreateAssetRequest {
  Asset asset = 1;
}

message GetAssetRequest {
  string asset_id = 1;
}

message UpdateAssetRequest {
  Asset asset = 1;
  string lifecycle_note = 2;
}

message ListAssetLifecycleRequest {
  string asset_id = 1;
}

message ListAssetLifecycleResponse {
  repeated AssetLifecycleEvent items = 1;
}

message Asset {
  string id = 1;
  string name = 2;
  string kind = 3;
  string serial_number = 4;
  string department_id = 5;
  string user_id = 6;
  string status = 7;
  string asset_tag = 8;
  string hostname = 9;
  string site_id = 10;
  string building_id = 11;
  string room_id = 12;
  google.protobuf.Timestamp purchase_date = 13;
  int64 revision = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  string organization_id = 17;
}

message AssetLifecycleEvent {
  string id = 1;
  string organization_id = 2;
  string asset_id = 3;
  string from_status = 4;
  string to_status = 5;
  string note = 6;
  int64 revision = 7;
  string actor_id = 8;
  google.protobuf.Timestamp occurred_at = 9;
}

enum RecordStatus {
  RECORD_STATUS_UNSPECIFIED = 0;
  RECORD_STATUS_ACTIVE = 1;
  RECORD_STATUS_INACTIVE = 2;
}

enum IdentityKind {
  IDENTITY_KIND_UNSPECIFIED = 0;
  IDENTITY_KIND_PERSON = 1;
  IDENTITY_KIND_SHARED = 2;
  IDENTITY_KIND_PUBLIC = 3;
  IDENTITY_KIND_LAB = 4;
}

enum AssigneeKind {
  ASSIGNEE_KIND_UNSPECIFIED = 0;
  ASSIGNEE_KIND_IDENTITY = 1;
  ASSIGNEE_KIND_DEPARTMENT = 2;
}

enum AssignmentRole {
  ASSIGNMENT_ROLE_UNSPECIFIED = 0;
  ASSIGNMENT_ROLE_PRIMARY = 1;
  ASSIGNMENT_ROLE_USER = 2;
  ASSIGNMENT_ROLE_DEPARTMENT = 3;
}

message ListSitesRequest {}

message ListSitesResponse {
  repeated Site items = 1;
}

message CreateSiteRequest {
  string name = 1;
  RecordStatus status = 2;
  Address address = 3;
}

message Site {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  RecordStatus status = 4;
  uint64 revision = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  Address address = 8;
}

message Address {
  string line1 = 1;
  string line2 = 2;
  string city = 3;
  string region = 4;
  string postal_code = 5;
  string country = 6;
}

message ListBuildingsRequest {
  string site_id = 1;
}

message ListBuildingsResponse {
  repeated Building items = 1;
}

message CreateBuildingRequest {
