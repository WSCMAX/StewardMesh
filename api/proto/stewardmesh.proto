  // dated real-device record exists; value 3 must not be reused.
  reserved 3;
  reserved "ASSET_LABEL_OUTPUT_ZPL";
}

message GenerateAssetLabelBatchRequest {
  // Exact retries reuse this safe stable key within the bounded replay window;
  // a retained key cannot represent two inputs and an expired replay needs a
  // new key.
  string idempotency_key = 1;
  // Exact ID and immutable version returned by ListAssetLabelTemplates.
  string template_id = 2;
  int64 template_version = 3;
  // One to fifty unique active identifier IDs of one symbology. SVG requires
  // exactly one and PDF emits one physical page per item. The adapter rechecks
  // read, write, scope, and ownership for every selected asset before returning
  // bytes.
  repeated string identifier_ids = 4;
  // All rendered human-readable fields are bounded printable ASCII so SVG and
  // PDF cannot silently substitute different glyphs.
  AssetLabelOutput output = 5;
  bool test_print = 6;
}

