  AssignmentRole role = 6;
  google.protobuf.Timestamp effective_from = 7;
  google.protobuf.Timestamp effective_to = 8;
  string created_by = 9;
  google.protobuf.Timestamp created_at = 10;
}

enum ThreadTargetType {
  THREAD_TARGET_TYPE_UNSPECIFIED = 0;
  THREAD_TARGET_TYPE_ASSET = 1;
  THREAD_TARGET_TYPE_PURCHASE = 2;
  THREAD_TARGET_TYPE_CONTRACT = 3;
  THREAD_TARGET_TYPE_SOFTWARE = 4;
  THREAD_TARGET_TYPE_BUDGET = 5;
  THREAD_TARGET_TYPE_GOAL = 6;
}

enum TagRuleMode {
  TAG_RULE_MODE_UNSPECIFIED = 0;
  TAG_RULE_MODE_INCLUDE = 1;
  TAG_RULE_MODE_SUPPRESS = 2;
}

message ListTagsRequest {}

message ListTagsResponse {
  repeated Tag items = 1;
}

message GetTagRequest {
  string tag_id = 1;
}

message CreateTagRequest {
  string id = 1;
  string name = 2;
  string parent_id = 3;
  bool inherit_by_default = 4;
}

message UpdateTagRequest {
  string tag_id = 1;
  string name = 2;
  string parent_id = 3;
  bool inherit_by_default = 4;
  int64 revision = 5;
}

message Tag {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  string parent_id = 4;
  bool inherit_by_default = 5;
  int64 revision = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ListGoalsRequest {}

message ListGoalsResponse {
  repeated Goal items = 1;
}

message GetGoalRequest {
  string goal_id = 1;
}

message CreateGoalRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string parent_id = 4;
}

message UpdateGoalRequest {
  string goal_id = 1;
  string name = 2;
  string description = 3;
  string parent_id = 4;
  int64 revision = 5;
}

