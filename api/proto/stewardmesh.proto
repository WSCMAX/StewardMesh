  string tag_id = 4;
  TagRuleMode mode = 5;
  int64 revision = 6;
  string updated_by = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message DeleteTagRuleRequest {
  ThreadTargetType target_type = 1;
  string target_id = 2;
  string tag_id = 3;
  int64 revision = 4;
