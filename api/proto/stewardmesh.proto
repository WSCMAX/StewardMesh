  uint32 created = 1;
  uint32 updated = 2;
  uint32 unchanged = 3;
  uint32 deactivated = 4;
  uint32 conflicts = 5;
  uint32 failed = 6;
}

message DirectoryImportRecord {
  string source_record_id = 1;
  // identity, group, or membership.
  string kind = 2;
  string identity_kind = 3;
  string display_name = 4;
  string email = 5;
  string status = 6;
  string department = 7;
  // Provider adapters expose only a bounded allowlisted projection. Raw
  // Microsoft Graph properties and credentials are never represented.
  map<string, string> directory_attributes = 8;
  // Stable direct group source references, sorted and bounded by the server.
  repeated string group_source_ids = 9;
  string group_name = 10;
  string description = 11;
  string group_source_id = 12;
  string member_source_id = 13;
  // subject or group when kind is membership.
  string member_kind = 14;
  // Allowlisted normalized string metadata, never raw provider extensions.
  map<string, string> metadata = 15;
}

message DirectoryImportItem {
  string id = 1;
  uint32 ordinal = 2;
  // Bounded normalized typed record. Raw provider payloads, arbitrary
  // attributes, credentials, and internal mapping digests are not represented.
  DirectoryImportRecord record = 3;
  string target_id = 4;
  uint64 expected_revision = 5;
  DirectoryImportAction action = 6;
  DirectoryImportOutcome outcome = 7;
  DirectoryImportFailureClass failure_class = 8;
  bool retryable = 9;
  string error = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message DirectoryImportAttempt {
  string id = 1;
  DirectoryImportOperation operation = 2;
  uint32 number = 3;
  DirectoryImportBatchStatus status = 4;
  DirectoryImportFailureClass failure_class = 5;
  bool retryable = 6;
  string error = 7;
  reserved 8;
  string correlation_id = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp completed_at = 11;
}

message DirectoryImportBatch {
  string id = 1;
  string source_system_id = 2;
  string provider = 3;
  string config_revision = 4;
  DirectoryImportBatchStatus status = 5;
  // Missing-source deactivations are planned only for a complete snapshot.
  bool complete_snapshot = 6;
  DirectoryImportCounts counts = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  google.protobuf.Timestamp completed_at = 10;
}

message DirectoryImportBatchDetail {
  DirectoryImportBatch batch = 1;
  // Complete mapping-safe plan and append-only attempt history.
  repeated DirectoryImportItem items = 2;
  repeated DirectoryImportAttempt attempts = 3;
}

message DirectoryImportOperationResult {
  DirectoryImportBatch batch = 1;
  // True when this exact idempotent operation returned its persisted result.
  bool replay = 2;
}

