syntax = "proto3";

package stewardmesh.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/maxlemke/stewardmesh/api/proto;stewardmeshv1";

// Requirement: REQ-FOUNDATION-001.
service FoundationService {
  rpc GetOrganization(GetOrganizationRequest) returns (Organization);
}

// Versioned record templates and provider-neutral typed validation.
// Requirement: REQ-PATTERNS-001. Feature: templates.schemas.
// The schema and validation messages are the stable Exchange seam; Exchange
// can validate package rows without coupling to the REST or PostgreSQL layers.
service PatternsService {
  rpc ListTemplates(ListPatternsTemplatesRequest) returns (ListPatternsTemplatesResponse);
  rpc CreateTemplate(CreatePatternsTemplateRequest) returns (PatternsTemplate);
  rpc GetTemplate(GetPatternsTemplateRequest) returns (PatternsTemplate);
  rpc GetTemplateSchema(GetPatternsTemplateSchemaRequest) returns (PatternsTemplate);
  rpc CopyTemplate(CopyPatternsTemplateRequest) returns (PatternsTemplate);
  rpc CreateTemplateVersion(CreatePatternsTemplateVersionRequest) returns (PatternsTemplate);
  rpc ValidateRecord(ValidatePatternsRecordRequest) returns (PatternsValidationResult);
  rpc ExportCSVTemplate(ExportPatternsCSVTemplateRequest) returns (ExportPatternsCSVTemplateResponse);
}

// Guard authentication contract. OpenID Connect authorization-code redirects
// remain browser HTTP endpoints; their JIT accounts use this same principal
// and session boundary after callback verification.
// Secure transport and metadata behavior: SEC-HTTP-001.
service GuardService {
  rpc GetBootstrapStatus(GetBootstrapStatusRequest) returns (BootstrapStatus);
  rpc BootstrapAdministrator(BootstrapAdministratorRequest) returns (AuthenticationSession);
  rpc AuthenticateLocal(AuthenticateLocalRequest) returns (AuthenticationSession);
  rpc GetSession(GetSessionRequest) returns (AuthenticationSession);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc ListGuardAccess(ListGuardAccessRequest) returns (ListGuardAccessResponse);
  rpc CreateRole(CreateRoleRequest) returns (GuardRole);
  rpc CreateRoleAssignment(CreateRoleAssignmentRequest) returns (GuardRoleAssignment);
  rpc DeleteRoleAssignment(DeleteRoleAssignmentRequest) returns (DeleteRoleAssignmentResponse);
  rpc ListResourceOwnership(ListResourceOwnershipRequest) returns (ListResourceOwnershipResponse);
  rpc RegisterResourceOwnership(RegisterResourceOwnershipRequest) returns (GuardResourceOwnership);
  rpc ClaimResourceOwnership(ClaimResourceOwnershipRequest) returns (GuardResourceOwnership);
}

// Authenticated Guard RPCs carry the opaque session bearer in gRPC
// authorization metadata. The bearer is never repeated in request bodies.

// Requirements: REQ-ATLAS-001, REQ-ATLAS-CODES-001.
// Features: inventory.assets, inventory.models, inventory.identifiers.
// Requirements: REQ-ATLAS-001, REQ-ATLAS-MODELS-001, REQ-ATLAS-CODES-001.
service AssetService {
  rpc ListAssetModels(ListAssetModelsRequest) returns (ListAssetModelsResponse);
  rpc GetAssetModel(GetAssetModelRequest) returns (AssetModel);
  rpc GetAssetModelInventory(GetAssetModelInventoryRequest) returns (AssetModelInventory);
  rpc ResolveAssetModel(ResolveAssetModelRequest) returns (AssetModel);
  rpc CreateAssetModel(CreateAssetModelRequest) returns (AssetModel);
  rpc UpdateAssetModel(UpdateAssetModelRequest) returns (AssetModel);
  rpc RetireAssetModel(RetireAssetModelRequest) returns (AssetModel);
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse);
  rpc GetAsset(GetAssetRequest) returns (Asset);
  rpc CreateAsset(CreateAssetRequest) returns (Asset);
  rpc CreateAssetsFromModel(CreateAssetsFromModelRequest) returns (CreateAssetsFromModelResponse);
  rpc UpdateAsset(UpdateAssetRequest) returns (Asset);
  rpc ListAssetLifecycle(ListAssetLifecycleRequest) returns (ListAssetLifecycleResponse);
  // Resolution reauthorizes the matched asset against the caller's Guard
  // organization, site, department, or resource scope before returning it.
  rpc ResolveAssetIdentifier(ResolveAssetIdentifierRequest) returns (AssetIdentifier);
  rpc ListAssetIdentifiers(ListAssetIdentifiersRequest) returns (ListAssetIdentifiersResponse);
  rpc CreateAssetIdentifier(CreateAssetIdentifierRequest) returns (CreateAssetIdentifierResponse);
  rpc ReplaceAssetIdentifier(ReplaceAssetIdentifierRequest) returns (ReplaceAssetIdentifierResponse);
  rpc DeactivateAssetIdentifier(DeactivateAssetIdentifierRequest) returns (DeactivateAssetIdentifierResponse);
}

// People directory and effective-dated asset assignments.
// Requirements: REQ-PEOPLE-001, REQ-DIRECTORY-EXPANSION-001.
// Feature: identity.directory.
// Directory visibility is derived from authenticated Guard grants and is
// never accepted from client-provided request fields.
service PeopleService {
  rpc ListSites(ListSitesRequest) returns (ListSitesResponse);
  rpc CreateSite(CreateSiteRequest) returns (Site);
  rpc ListBuildings(ListBuildingsRequest) returns (ListBuildingsResponse);
  rpc CreateBuilding(CreateBuildingRequest) returns (Building);
  rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse);
  rpc CreateRoom(CreateRoomRequest) returns (Room);
  rpc ListDepartments(ListDepartmentsRequest) returns (ListDepartmentsResponse);
  rpc CreateDepartment(CreateDepartmentRequest) returns (Department);
  rpc SearchIdentities(SearchIdentitiesRequest) returns (SearchIdentitiesResponse);
  rpc CreateIdentity(CreateIdentityRequest) returns (DirectoryIdentity);
  rpc ListAssetAssignments(ListAssetAssignmentsRequest) returns (ListAssetAssignmentsResponse);
  rpc CreateAssetAssignment(CreateAssetAssignmentRequest) returns (AssetAssignment);
  rpc EndAssetAssignment(EndAssetAssignmentRequest) returns (AssetAssignment);
}

// Organization-scoped tag and goal hierarchies with explicit inheritance
// provenance. Requirement: REQ-THREADS-001. Feature: goals.tags.
service ThreadsService {
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc GetTag(GetTagRequest) returns (Tag);
  rpc CreateTag(CreateTagRequest) returns (Tag);
  rpc UpdateTag(UpdateTagRequest) returns (Tag);
  rpc ListGoals(ListGoalsRequest) returns (ListGoalsResponse);
  rpc GetGoal(GetGoalRequest) returns (Goal);
  rpc CreateGoal(CreateGoalRequest) returns (Goal);
  rpc UpdateGoal(UpdateGoalRequest) returns (Goal);
  rpc ListEffectiveTags(ListEffectiveTagsRequest) returns (ListEffectiveTagsResponse);
  rpc SetTagRule(SetTagRuleRequest) returns (TagRule);
  rpc DeleteTagRule(DeleteTagRuleRequest) returns (DeleteTagRuleResponse);
  rpc ListGoalLinks(ListGoalLinksRequest) returns (ListGoalLinksResponse);
  rpc LinkGoal(LinkGoalRequest) returns (GoalLink);
  rpc UnlinkGoal(UnlinkGoalRequest) returns (UnlinkGoalResponse);
}

// Private object storage with durable metadata and short-lived access.
// Requirement: REQ-STORAGE-001. Feature: storage.blobs.
service VaultService {
  rpc ListBlobs(ListBlobsRequest) returns (ListBlobsResponse);
  rpc GetBlob(GetBlobRequest) returns (VaultBlob);
  rpc CreateBlob(CreateBlobRequest) returns (VaultBlob);
  rpc DownloadBlob(DownloadBlobRequest) returns (VaultBlobContent);
  rpc AuthorizeDownload(AuthorizeBlobDownloadRequest) returns (VaultDownloadAuthorization);
}

// Organization-scoped lifecycle planning and replacement forecasting.
// Requirement: REQ-HORIZON-001. Feature: lifecycle.planning.
service HorizonService {
  rpc ListPlans(ListHorizonPlansRequest) returns (ListHorizonPlansResponse);
  rpc CreatePlan(CreateHorizonPlanRequest) returns (HorizonPlan);
  rpc UpdatePlan(UpdateHorizonPlanRequest) returns (HorizonPlan);
  rpc ListPlanHistory(ListHorizonPlanHistoryRequest) returns (ListHorizonPlanHistoryResponse);
  rpc GetForecast(GetHorizonForecastRequest) returns (HorizonForecast);
  rpc ExportCSV(ExportHorizonCSVRequest) returns (ExportHorizonCSVResponse);
}

// Organization-scoped procurement and financial planning.
// Requirement: REQ-LEDGER-001. Feature: procurement.finance.
service LedgerService {
  rpc GetSnapshot(GetLedgerSnapshotRequest) returns (LedgerSnapshot);
  rpc CreateVendor(CreateLedgerVendorRequest) returns (LedgerVendor);
  rpc CreatePurchaseOrder(CreateLedgerPurchaseOrderRequest) returns (LedgerPurchaseOrder);
  rpc UpdatePurchaseOrderStatus(UpdateLedgerPurchaseOrderStatusRequest) returns (LedgerPurchaseOrder);
  rpc CreateContract(CreateLedgerContractRequest) returns (LedgerContract);
  rpc UpdateContractStatus(UpdateLedgerContractStatusRequest) returns (LedgerContract);
  rpc CreateCommitment(CreateLedgerCommitmentRequest) returns (LedgerCommitment);
  rpc CreateBudget(CreateLedgerBudgetRequest) returns (LedgerBudget);
  rpc ReconcileCost(ReconcileLedgerCostRequest) returns (ReconcileLedgerCostResponse);
  rpc GetBudgetVariance(GetLedgerBudgetVarianceRequest) returns (LedgerBudgetVariance);
  rpc ExportCSV(ExportLedgerCSVRequest) returns (ExportLedgerCSVResponse);
}

message GetOrganizationRequest {}

message Organization {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message ListPatternsTemplatesRequest {
  // Exact provider-neutral record family; empty returns every family.
  string record_type = 1;
  bool include_retired = 2;
}

message ListPatternsTemplatesResponse {
  repeated PatternsTemplate items = 1;
}

message GetPatternsTemplateRequest {
  string template_id = 1;
  // Zero resolves the latest immutable version; positive values select one.
  int64 version = 2;
}

message GetPatternsTemplateSchemaRequest {
  string template_id = 1;
  // Zero resolves the latest immutable version; positive values select one.
  int64 version = 2;
}

message CreatePatternsTemplateRequest {
  // Optional stable ID; the service generates one when empty.
  string id = 1;
  string record_type = 2;
  string name = 3;
  string description = 4;
  repeated PatternsField fields = 5;
}

message CopyPatternsTemplateRequest {
  string source_template_id = 1;
  // Zero resolves the latest immutable source version.
  int64 source_version = 2;
  // Optional stable ID for the newly created custom template.
  string id = 3;
  string name = 4;
  // Empty inherits the source version description.
  string description = 5;
}

message CreatePatternsTemplateVersionRequest {
  string template_id = 1;
  // Empty inherits the current version description.
  string description = 2;
  repeated PatternsField fields = 3;
}

message ValidatePatternsRecordRequest {
  string template_id = 1;
  // Zero resolves the latest immutable version.
  int64 version = 2;
  // Provider-neutral JSON values keyed by PatternsField.key. This keeps the
  // request usable by REST forms and Exchange package ingestion alike.
  google.protobuf.Struct values = 3;
  // Reference field keys whose resolved target is missing or not visible.
  repeated string missing_references = 4;
  // Missing references can enter holding only when their fields allow it.
  bool allow_holding_record = 5;
}

message ExportPatternsCSVTemplateRequest {
  string template_id = 1;
  // Zero resolves the latest immutable version.
  int64 version = 2;
}

message ExportPatternsCSVTemplateResponse {
  bytes content = 1;
  string media_type = 2;
  string filename = 3;
  string template_id = 4;
  int64 version = 5;
}

message PatternsTemplate {
  string id = 1;
  // Empty for code-versioned built-ins; set for organization-owned templates.
  string organization_id = 2;
  string record_type = 3;
  string name = 4;
  string description = 5;
  // Immutable schema version used by forms, CSV tooling, and Exchange.
  int64 version = 6;
  bool built_in = 7;
  PatternsTemplateStatus status = 8;
  repeated PatternsField fields = 9;
  string created_by = 10;
  google.protobuf.Timestamp created_at = 11;
}

message PatternsField {
  string key = 1;
  string label = 2;
  // Concise guidance rendered beside generated controls.
  string help = 3;
  PatternsFieldType type = 4;
  bool required = 5;
  bool allow_holding = 6;
  // Target record family for reference and attachment fields.
  string reference_type = 7;
  repeated string options = 8;
  // Presence flags distinguish an omitted bound from an explicit zero bound.
  double minimum = 9;
  bool has_minimum = 10;
  double maximum = 11;
  bool has_maximum = 12;
  uint32 maximum_length = 13;
  string currency_field = 14;
  // Accessible control name and validation-message prefix.
  string accessible_label = 15;
  // Header emitted by the CSV template in field order.
  string csv_header = 16;
}

message PatternsFieldError {
  string field = 1;
  string code = 2;
  // Accessible-label-prefixed correction guidance.
  string message = 3;
}

message PatternsHoldingReference {
  string field = 1;
  string reference_type = 2;
  // Empty when a required reference value itself was absent.
  string value = 3;
}

message PatternsValidationResult {
  PatternsValidationStatus status = 1;
  google.protobuf.Struct normalized_values = 2;
  repeated PatternsFieldError errors = 3;
  // Non-empty when the record is otherwise valid but needs reconciliation.
  repeated PatternsHoldingReference holding_references = 4;
}

enum PatternsFieldType {
  PATTERNS_FIELD_TYPE_UNSPECIFIED = 0;
  PATTERNS_FIELD_TYPE_TEXT = 1;
  PATTERNS_FIELD_TYPE_NUMBER = 2;
  PATTERNS_FIELD_TYPE_DATE = 3;
  PATTERNS_FIELD_TYPE_MONEY = 4;
  PATTERNS_FIELD_TYPE_ENUM = 5;
  PATTERNS_FIELD_TYPE_ATTACHMENT = 6;
  PATTERNS_FIELD_TYPE_REFERENCE = 7;
}

enum PatternsTemplateStatus {
  PATTERNS_TEMPLATE_STATUS_UNSPECIFIED = 0;
  PATTERNS_TEMPLATE_STATUS_ACTIVE = 1;
  PATTERNS_TEMPLATE_STATUS_RETIRED = 2;
}

enum PatternsValidationStatus {
  PATTERNS_VALIDATION_STATUS_UNSPECIFIED = 0;
  PATTERNS_VALIDATION_STATUS_VALID = 1;
  PATTERNS_VALIDATION_STATUS_HOLDING = 2;
  PATTERNS_VALIDATION_STATUS_INVALID = 3;
}

// Requirement: SEC-GUARD-001.
message GetBootstrapStatusRequest {}

message BootstrapStatus {
  bool required = 1;
  bool token_required = 2;
  uint32 minimum_password_characters = 3;
  bool oidc_enabled = 4;
  bool saml_enabled = 5;
}

message BootstrapAdministratorRequest {
  string username = 1;
  string email = 2;
  string display_name = 3;
  string password = 4;
  string bootstrap_token = 5;
}

message AuthenticateLocalRequest {
  string username = 1;
  string password = 2;
}

message GetSessionRequest {}

message LogoutRequest {
  string csrf_token = 1;
}

message LogoutResponse {}

message AuthenticationSession {
  Principal principal = 1;
  string session_token = 2;
  string csrf_token = 3;
  google.protobuf.Timestamp expires_at = 4;
  repeated string permissions = 5;
}

message Principal {
  string subject = 1;
  string organization_id = 2;
  string username = 3;
  string email = 4;
  string display_name = 5;
  repeated string roles = 6;
}

message AuthorizationScope {
  string kind = 1;
  string organization_id = 2;
  string resource_id = 3;
}

message PermissionGrant {
  string permission = 1;
  AuthorizationScope scope = 2;
}

message ListGuardAccessRequest {}

message ListGuardAccessResponse {
  repeated GuardAccount accounts = 1;
  repeated GuardRole roles = 2;
  repeated GuardRoleAssignment assignments = 3;
  repeated GuardPolicyBundle policy_bundles = 4;
  repeated string available_permissions = 5;
}

message GuardAccount {
  string id = 1;
  string username = 2;
  string email = 3;
  string display_name = 4;
  string status = 5;
}

message GuardRole {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string permissions = 4;
  repeated string policy_bundle_ids = 5;
  string source = 6;
  bool managed = 7;
}

message GuardPolicyBundle {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string permissions = 4;
}

message CreateRoleRequest {
  string name = 1;
  string description = 2;
  repeated string permissions = 3;
  repeated string policy_bundle_ids = 4;
  string csrf_token = 5;
}

message GuardRoleAssignment {
  string id = 1;
  string account_id = 2;
  string role_id = 3;
  AuthorizationScope scope = 4;
  string source = 5;
  bool managed = 6;
  google.protobuf.Timestamp created_at = 7;
}

message CreateRoleAssignmentRequest {
  string account_id = 1;
  string role_id = 2;
  AuthorizationScope scope = 3;
  string csrf_token = 4;
}

message DeleteRoleAssignmentRequest {
  string assignment_id = 1;
  string csrf_token = 2;
}

message DeleteRoleAssignmentResponse {}

message ListResourceOwnershipRequest {}

message ListResourceOwnershipResponse {
  repeated GuardResourceOwnership items = 1;
}

message GuardResourceOwnership {
  string resource_type = 1;
  string resource_id = 2;
  string source_system_id = 3;
  string source_record_id = 4;
  bool write_locked = 5;
  google.protobuf.Timestamp registered_at = 6;
  string claimed_by = 7;
  google.protobuf.Timestamp claimed_at = 8;
}

message RegisterResourceOwnershipRequest {
  string resource_type = 1;
  string resource_id = 2;
  string source_system_id = 3;
  string source_record_id = 4;
  string csrf_token = 5;
}

message ClaimResourceOwnershipRequest {
  string resource_type = 1;
  string resource_id = 2;
  string csrf_token = 3;
}

message ListAssetsRequest {
  string search = 1;
  string kind = 2;
  string status = 3;
  string site_id = 4;
  string department_id = 5;
  string user_id = 6;
  int32 limit = 7;
  string model_id = 8;
  string deployment_context = 9;
}

message ListAssetModelsRequest {
  string search = 1;
  string kind = 2;
  string status = 3;
  int32 limit = 4;
}

message ListAssetModelsResponse {
  repeated AssetModel items = 1;
}

message CreateAssetModelRequest {
  AssetModel model = 1;
}

message GetAssetModelRequest {
  string model_id = 1;
}

message GetAssetModelInventoryRequest {
  string model_id = 1;
  string status = 2;
  string site_id = 3;
  string department_id = 4;
  string user_id = 5;
  string deployment_context = 6;
  string group_by = 7;
  int32 limit = 8;
}

message AssetModelInventoryGroup {
  string key = 1;
  int32 count = 2;
}

message AssetModelInventory {
  string model_id = 1;
  int32 total_count = 2;
  int32 filtered_count = 3;
  string group_by = 4;
  repeated AssetModelInventoryGroup groups = 5;
  repeated Asset items = 6;
}

message ResolveAssetModelRequest {
  string manufacturer = 1;
  string name = 2;
  string model_number = 3;
}

message UpdateAssetModelRequest {
  AssetModel model = 1;
}

message RetireAssetModelRequest {
  string model_id = 1;
  int64 revision = 2;
}

message ListAssetsResponse {
  repeated Asset items = 1;
}

message CreateAssetRequest {
  Asset asset = 1;
}

message CreateAssetsFromModelRequest {
  string model_id = 1;
  repeated Asset items = 2;
}

message CreateAssetsFromModelResponse {
  repeated Asset items = 1;
}

message GetAssetRequest {
  string asset_id = 1;
}

message UpdateAssetRequest {
  Asset asset = 1;
  string lifecycle_note = 2;
}

message ListAssetLifecycleRequest {
  string asset_id = 1;
}

message ListAssetLifecycleResponse {
  repeated AssetLifecycleEvent items = 1;
}

message ResolveAssetIdentifierRequest {
  AssetIdentifierSymbology symbology = 1;
  // Code 128 accepts ASCII values through 128 bytes. QR accepts UTF-8 values
  // through 512 bytes. The service enforces byte limits after normalization.
  string value = 2;
}

message ListAssetIdentifiersRequest {
  string asset_id = 1;
}

message ListAssetIdentifiersResponse {
  repeated AssetIdentifier items = 1;
}

message CreateAssetIdentifierRequest {
  string asset_id = 1;
  string id = 2;
  AssetIdentifierSymbology symbology = 3;
  // Code 128 accepts ASCII values through 128 bytes. QR accepts UTF-8 values
  // through 512 bytes. The service enforces byte limits after normalization.
  string value = 4;
  string display_value = 5;
  AssetIdentifierSource source = 6;
  bool primary = 7;
}

message CreateAssetIdentifierResponse {
  AssetIdentifier identifier = 1;
  bool created = 2;
}

message ReplaceAssetIdentifierRequest {
  string asset_id = 1;
  string identifier_id = 2;
  string replacement_id = 3;
  AssetIdentifierSymbology symbology = 4;
  // Code 128 accepts ASCII values through 128 bytes. QR accepts UTF-8 values
  // through 512 bytes. The service enforces byte limits after normalization.
  string value = 5;
  string display_value = 6;
  AssetIdentifierSource source = 7;
  int64 revision = 8;
}

message ReplaceAssetIdentifierResponse {
  AssetIdentifier identifier = 1;
  bool changed = 2;
}

message DeactivateAssetIdentifierRequest {
  string asset_id = 1;
  string identifier_id = 2;
  int64 revision = 3;
}

message DeactivateAssetIdentifierResponse {
  AssetIdentifier identifier = 1;
  bool changed = 2;
}

message AssetIdentifier {
  string id = 1;
  string organization_id = 2;
  string asset_id = 3;
  AssetIdentifierSymbology symbology = 4;
  // Normalized Code 128 values are ASCII through 128 bytes. Normalized QR
  // values are UTF-8 through 512 bytes.
  string normalized_value = 5;
  string display_value = 6;
  AssetIdentifierSource source = 7;
  bool primary = 8;
  AssetIdentifierStatus status = 9;
  string supersedes_id = 10;
  string replaced_by_id = 11;
  int64 revision = 12;
  string created_by = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  google.protobuf.Timestamp deactivated_at = 16;
}

enum AssetIdentifierSymbology {
  ASSET_IDENTIFIER_SYMBOLOGY_UNSPECIFIED = 0;
  ASSET_IDENTIFIER_SYMBOLOGY_CODE128 = 1;
  ASSET_IDENTIFIER_SYMBOLOGY_QR = 2;
}

enum AssetIdentifierSource {
  ASSET_IDENTIFIER_SOURCE_UNSPECIFIED = 0;
  ASSET_IDENTIFIER_SOURCE_USER_ENTERED = 1;
  ASSET_IDENTIFIER_SOURCE_IMPORTED = 2;
  ASSET_IDENTIFIER_SOURCE_GENERATED = 3;
}

enum AssetIdentifierStatus {
  ASSET_IDENTIFIER_STATUS_UNSPECIFIED = 0;
  ASSET_IDENTIFIER_STATUS_ACTIVE = 1;
  ASSET_IDENTIFIER_STATUS_REPLACED = 2;
  ASSET_IDENTIFIER_STATUS_DEACTIVATED = 3;
}

message Asset {
  string id = 1;
  string name = 2;
  string kind = 3;
  string serial_number = 4;
  string department_id = 5;
  string user_id = 6;
  string status = 7;
  string asset_tag = 8;
  string hostname = 9;
  string site_id = 10;
  string building_id = 11;
  string room_id = 12;
  google.protobuf.Timestamp purchase_date = 13;
