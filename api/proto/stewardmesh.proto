message Room {
  string id = 1;
  string organization_id = 2;
  string site_id = 3;
  string building_id = 4;
  string number = 5;
  string name = 6;
  RecordStatus status = 7;
  uint64 revision = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
