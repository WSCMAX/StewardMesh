  // One of planned, in_service, refresh_due, approved, or retired.
  string lifecycle_stage = 6;
  // Exact minor units from 0 through 9007199254740991.
  int64 replacement_cost_minor = 7;
  string currency = 8;
  google.protobuf.Timestamp effective_from = 9;
}

