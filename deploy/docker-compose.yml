# REQ-PLATFORM-VALKEY-001 / platform.runtime; REQ-DIRECTORY-EXPANSION-005 / integrations.protocols; REQ-DIRECTORY-EXPANSION-007 / platform.foundation
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: stewardmesh
      POSTGRES_PASSWORD: stewardmesh
      POSTGRES_DB: stewardmesh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stewardmesh -d stewardmesh"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - stewardmesh-postgres:/var/lib/postgresql
  valkey:
    profiles: ["cache", "demo"]
    image: valkey/valkey:9.1.1-alpine
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
      - --loglevel
      - warning
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    stop_grace_period: 10s
  grouper:
    profiles: ["integrations", "demo"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: grouper-fixture
    image: stewardmesh-grouper-fixture:local
    environment:
      GROUPER_FIXTURE_TOKEN: stewardmesh-local-fixture-token
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "/grouper-fixture", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Explicit one-shot initializer for the clearly labeled synthetic dataset.
  # It is absent from the default profile and never needs the Grouper fixture.
  demo-seed:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: stewardmesh
    image: stewardmesh:local
    command: ["seed-demo"]
    environment:
      STEWARDMESH_ADDR: 127.0.0.1:8080
      STEWARDMESH_ALLOWED_ORIGIN: http://localhost:5173
      STEWARDMESH_SESSION_COOKIE_SECURE: "false"
      STEWARDMESH_REPOSITORY_DRIVER: postgres
      STEWARDMESH_DATABASE_URL: postgres://stewardmesh:stewardmesh@postgres:5432/stewardmesh?sslmode=disable
      STEWARDMESH_CACHE_DRIVER: none
      STEWARDMESH_STORAGE_DRIVER: local
      STEWARDMESH_BLOB_DIR: /tmp/stewardmesh-demo-blobs
      STEWARDMESH_ORGANIZATION_ID: demo-local
      STEWARDMESH_ORGANIZATION_NAME: "[Synthetic Demo] StewardMesh Local"
      STEWARDMESH_SEED_SYNTHETIC: "true"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: "no"

volumes:
  stewardmesh-postgres:
