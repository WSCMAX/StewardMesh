# REQ-PLATFORM-VALKEY-001 / platform.runtime
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: stewardmesh
      POSTGRES_PASSWORD: stewardmesh
      POSTGRES_DB: stewardmesh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stewardmesh -d stewardmesh"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - stewardmesh-postgres:/var/lib/postgresql
  valkey:
    profiles: ["cache", "demo"]
    image: valkey/valkey:9.1.1-alpine
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
      - --loglevel
      - warning
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    stop_grace_period: 10s
  grouper:
    profiles: ["integrations", "demo"]
    image: i2incommon/grouper:latest
    environment:
      GROUPER_RUN_APIS_GROUPERWS: "true"
    ports:
      - "8081:8080"

volumes:
  stewardmesh-postgres:
