<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">StewardMesh favicon with filled bridge face</title>
  <desc id="desc">A light rounded favicon where each mesh cell is filled, including the left bridge triangle.</desc>
