        <line x1="98" y1="113" x2="151" y2="142"/><line x1="107" y1="147" x2="151" y2="142"/>
        <line x1="107" y1="147" x2="143" y2="223"/><line x1="151" y1="142" x2="143" y2="223"/>
        <line x1="151" y1="142" x2="249" y2="202"/><line x1="143" y1="223" x2="194" y2="213"/>
        <line x1="143" y1="223" x2="210" y2="266"/><line x1="194" y1="213" x2="249" y2="202"/>
