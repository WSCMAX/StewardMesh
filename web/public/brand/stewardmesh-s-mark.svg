<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 294 370" role="img" aria-labelledby="title desc" class="stewardmesh-s-mark">
  <title id="title">StewardMesh network S mark</title>
  <desc id="desc">A configurable green, teal, and blue network S mark with fillable interior regions.</desc>
  <style>
    /* Override these custom properties on this SVG when it is inline. */
    :root {
      /* External image and favicon default: ink background for a cohesive mark. */
      --sm-fill: #061827;
      --sm-fill-green: var(--sm-fill);
      --sm-fill-teal: var(--sm-fill);
      --sm-fill-blue: var(--sm-fill);
      --sm-green: #46cf51;
      --sm-teal: #16bfa7;
      --sm-blue: #1768ef;
    }
    .sm-fill-green { fill: var(--sm-fill-green); }
    .sm-fill-teal { fill: var(--sm-fill-teal); }
    .sm-fill-blue { fill: var(--sm-fill-blue); }
    .sm-edge { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 4; }
    .sm-edge-green { stroke: var(--sm-green); }
    .sm-edge-teal { stroke: var(--sm-teal); }
    .sm-edge-blue { stroke: var(--sm-blue); }
    .sm-node-green { fill: var(--sm-green); }
    .sm-node-teal { fill: var(--sm-teal); }
    .sm-node-blue { fill: var(--sm-blue); }
  </style>

  <!-- Interior faces use ink by default and remain configurable when inlined. -->
  <g class="sm-interior" aria-hidden="true">
    <path class="sm-fill-green" d="M147 25 250 78 147 80 98 113 44 78Z"/>
    <path class="sm-fill-teal" d="M44 158 98 113 151 142 249 202 194 213 143 223 107 147Z"/>
    <path class="sm-fill-blue" d="M44 280 145 280 210 266 250 289 145 344Z"/>
  </g>

  <!-- Mesh connectors -->
  <g class="sm-edge sm-edge-green">
    <line x1="147" y1="25" x2="44" y2="78"/><line x1="147" y1="25" x2="250" y2="78"/>
    <line x1="44" y1="78" x2="98" y2="113"/><line x1="98" y1="113" x2="147" y2="80"/>
    <line x1="147" y1="80" x2="250" y2="78"/><line x1="44" y1="78" x2="44" y2="158"/>
  </g>
  <g class="sm-edge sm-edge-teal">
    <line x1="44" y1="158" x2="98" y2="113"/><line x1="44" y1="158" x2="107" y2="147"/>
    <line x1="44" y1="158" x2="143" y2="223"/><line x1="98" y1="113" x2="151" y2="142"/>
    <line x1="107" y1="147" x2="151" y2="142"/><line x1="107" y1="147" x2="143" y2="223"/>
    <line x1="151" y1="142" x2="143" y2="223"/><line x1="151" y1="142" x2="249" y2="202"/>
    <line x1="143" y1="223" x2="194" y2="213"/><line x1="143" y1="223" x2="210" y2="266"/>
    <line x1="194" y1="213" x2="249" y2="202"/><line x1="194" y1="213" x2="210" y2="266"/>
    <line x1="249" y1="202" x2="250" y2="289"/>
  </g>
  <g class="sm-edge sm-edge-blue">
    <line x1="44" y1="280" x2="145" y2="280"/><line x1="145" y1="280" x2="250" y2="289"/>
    <line x1="44" y1="280" x2="145" y2="344"/><line x1="145" y1="344" x2="250" y2="289"/>
    <line x1="145" y1="280" x2="210" y2="266"/><line x1="210" y1="266" x2="250" y2="289"/>
  </g>

  <!-- Nodes overlay the connectors, keeping every junction visually clean. -->
  <g class="sm-node-green">
    <circle cx="147" cy="25" r="15"/><circle cx="44" cy="78" r="15"/><circle cx="147" cy="80" r="14"/>
    <circle cx="250" cy="78" r="15"/><circle cx="98" cy="113" r="12"/>
  </g>
  <g class="sm-node-teal">
    <circle cx="44" cy="158" r="15"/><circle cx="107" cy="147" r="10"/><circle cx="151" cy="142" r="15"/>
    <circle cx="143" cy="223" r="15"/><circle cx="194" cy="213" r="11"/><circle cx="249" cy="202" r="15"/>
  </g>
  <g class="sm-node-blue">
    <circle cx="44" cy="280" r="15"/><circle cx="145" cy="280" r="12"/><circle cx="210" cy="266" r="9"/>
    <circle cx="250" cy="289" r="12"/><circle cx="145" cy="344" r="15"/>
  </g>
</svg>
